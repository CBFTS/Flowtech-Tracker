    }
    const removePhotoBtn = document.getElementById('remove-photo-btn');
    if(removePhotoBtn) removePhotoBtn.onclick = ()=>{
      draftTicket.photo = '';
      render();
    };
    const photoPreview = document.getElementById('photo-preview');
    if(photoPreview) photoPreview.onclick = ()=> viewPhoto(draftTicket.photo);

    // Signature pads
    setupSignaturePad('sig-delivered-canvas', 'signatureDelivered');
    setupSignaturePad('sig-received-canvas', 'signatureReceived');
    const clearSigDelivered = document.getElementById('clear-sig-delivered');
    if(clearSigDelivered) clearSigDelivered.onclick = ()=>{
      if(draftTicket.signatureDelivered && !confirm('Clear this signature? This cannot be undone.')) return;
      draftTicket.signatureDelivered = '';
      const canvas = document.getElementById('sig-delivered-canvas');
      if(canvas) canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
    };
    const clearSigReceived = document.getElementById('clear-sig-received');
    if(clearSigReceived) clearSigReceived.onclick = ()=>{
      if(draftTicket.signatureReceived && !confirm('Clear this signature? This cannot be undone.')) return;
      draftTicket.signatureReceived = '';
      const canvas = document.getElementById('sig-received-canvas');
      if(canvas) canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
    };

    // Load a saved equipment template
    const loadTemplateSelect = document.getElementById('load-template-select');
    if(loadTemplateSelect){
      loadTemplateSelect.onchange = ()=>{
        const tpl = templateCatalog.find(x=>x.id===loadTemplateSelect.value);
        if(!tpl) return;
        const newRows = tpl.items.map(item=>({id:eqid(), name:item.name, serial:'', bandColor:'', qty:item.qty}));
        // Replace a single still-empty row, otherwise append to what's there
        if(draftEquip.length===1 && !draftEquip[0].name){
          draftEquip = newRows;
        }else{
          draftEquip = draftEquip.concat(newRows);
        }
        render();
      };
    }

    // Save current equipment lines as a reusable template
    const saveAsTemplateBtn = document.getElementById('save-as-template-btn');
    if(saveAsTemplateBtn) saveAsTemplateBtn.onclick = async ()=>{
      const validItems = draftEquip
        .filter(e=>e.name && e.name.trim())
        .map(e=>({name:e.name.trim(), qty:Number(e.qty)||1}));
      if(validItems.length===0){
        alert('Add at least one piece of equipment before saving a template.');
        return;
      }
      const name = prompt('Name this template (e.g. "Standard Frac Package"):');
      if(!name || !name.trim()) return;
      templateCatalog.push({ id: 'tpl_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name: name.trim(), items: validItems });
      await saveTemplates();
      render();
    };

    // Manage equipment list
    const toggleBtn = document.getElementById('toggle-manage-catalog');
    if(toggleBtn) toggleBtn.onclick = ()=>{
      showManageCatalog = !showManageCatalog;
      render();
    };
    const addCatalogBtn = document.getElementById('add-catalog-item');
    const newCatalogInput = document.getElementById('new-catalog-item');
    if(addCatalogBtn && newCatalogInput){
      const addItem = async ()=>{
        const val = newCatalogInput.value.trim();
        if(!val) return;
        if(!equipmentCatalog.includes(val)){
          equipmentCatalog.push(val);
          await saveCatalog();
        }
        render();
      };
      addCatalogBtn.onclick = addItem;
      newCatalogInput.onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); addItem(); } };
    }
    document.querySelectorAll('[data-catalog-remove]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.dataset.catalogRemove;
        equipmentCatalog = equipmentCatalog.filter(n=>n!==name);
        delete equipmentOwned[name];
        await saveCatalog();
        await saveEquipmentOwned();
        render();
      };
    });
    document.querySelectorAll('[data-owned-qty]').forEach(inp=>{
      inp.onchange = async ()=>{
        const name = inp.dataset.ownedQty;
        const val = inp.value.trim();
        if(val === ''){
          delete equipmentOwned[name];
        }else{
          equipmentOwned[name] = Number(val)||0;
        }
        await saveEquipmentOwned();
      };
    });

    // Manage inspection band color list
    const addColorBtn = document.getElementById('add-color-item');
    const newColorInput = document.getElementById('new-color-item');
    if(addColorBtn && newColorInput){
      const addColor = async ()=>{
        const val = newColorInput.value.trim();
        if(!val) return;
        if(!colorCatalog.includes(val)){
          colorCatalog.push(val);
          await saveColorCatalog();
        }
        render();
      };
      addColorBtn.onclick = addColor;
      newColorInput.onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); addColor(); } };
    }
    document.querySelectorAll('[data-color-remove]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.dataset.colorRemove;
        colorCatalog = colorCatalog.filter(n=>n!==name);
        await saveColorCatalog();
        render();
      };
    });

    // Manage rig / lease list
    const addRigBtn = document.getElementById('add-rig-item');
    const newRigInput = document.getElementById('new-rig-item');
    if(addRigBtn && newRigInput){
      const addRig = async ()=>{
        const val = newRigInput.value.trim();
        if(!val) return;
        addToCatalogIfNew(rigCatalog, val);
        await saveRigCatalog();
        render();
      };
      addRigBtn.onclick = addRig;
      newRigInput.onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); addRig(); } };
    }
    document.querySelectorAll('[data-rig-remove]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.dataset.rigRemove;
        rigCatalog = rigCatalog.filter(n=>n!==name);
        archivedRigs = archivedRigs.filter(n=>n!==name);
        await saveRigCatalog();
        await saveArchivedRigs();
        render();
      };
    });
    document.querySelectorAll('[data-rig-archive-toggle]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.dataset.rigArchiveToggle;
        if(archivedRigs.includes(name)){
          archivedRigs = archivedRigs.filter(n=>n!==name);
        }else{
          archivedRigs.push(name);
        }
        await saveArchivedRigs();
        render();
      };
    });

    // Manage customer / operator list
    const addCustomerBtn = document.getElementById('add-customer-item');
    const newCustomerInput = document.getElementById('new-customer-item');
    if(addCustomerBtn && newCustomerInput){
      const addCustomer = async ()=>{
        const val = newCustomerInput.value.trim();
        if(!val) return;
        addToCatalogIfNew(customerCatalog, val);
        await saveCustomerCatalog();
        render();
      };
      addCustomerBtn.onclick = addCustomer;
      newCustomerInput.onkeydown = (ev)=>{ if(ev.key === 'Enter'){ ev.preventDefault(); addCustomer(); } };
    }
    document.querySelectorAll('[data-customer-remove]').forEach(b=>{
      b.onclick = async ()=>{
        const name = b.dataset.customerRemove;
        customerCatalog = customerCatalog.filter(n=>n!==name);
        await saveCustomerCatalog();
        render();
      };
    });
    document.querySelectorAll('[data-template-remove]').forEach(b=>{
      b.onclick = async ()=>{
        const id = b.dataset.templateRemove;
        if(!confirm('Delete this template?')) return;
        templateCatalog = templateCatalog.filter(t=>t.id!==id);
        await saveTemplates();
        render();
      };
    });

    const saveBtn = document.getElementById('save-ticket');
    if(saveBtn) saveBtn.onclick = onSaveTicket;
    const cancelBtn = document.getElementById('cancel-edit');
    if(cancelBtn) cancelBtn.onclick = ()=>{
      editingId = null;
      resetDraftEquip();
      resetDraftTicket();
      currentTab = 'tickets';
      render();
    };
  }

  if(currentTab === 'tickets'){
    const search = document.getElementById('search-input');
    if(search){
      search.oninput = ()=>{
        searchTerm = search.value;
        render();
        const newSearch = document.getElementById('search-input');
        if(newSearch){ newSearch.focus(); newSearch.setSelectionRange(newSearch.value.length, newSearch.value.length); }
      };
    }
    const filterCustomer = document.getElementById('filter-customer');
    if(filterCustomer) filterCustomer.onchange = ()=>{ ticketFilterCustomer = filterCustomer.value; render(); };
    const filterRig = document.getElementById('filter-rig');
    if(filterRig) filterRig.onchange = ()=>{ ticketFilterRig = filterRig.value; render(); };
    const filterDateFrom = document.getElementById('filter-date-from');
    if(filterDateFrom) filterDateFrom.onchange = ()=>{ ticketFilterDateFrom = filterDateFrom.value; render(); };
    const filterDateTo = document.getElementById('filter-date-to');
    if(filterDateTo) filterDateTo.onchange = ()=>{ ticketFilterDateTo = filterDateTo.value; render(); };
    const clearFiltersBtn = document.getElementById('clear-filters-btn');
    if(clearFiltersBtn) clearFiltersBtn.onclick = ()=>{
      ticketFilterCustomer = ''; ticketFilterRig = ''; ticketFilterDateFrom = ''; ticketFilterDateTo = '';
      render();
    };
    const exportQbBtn = document.getElementById('export-quickbooks-btn');
    if(exportQbBtn) exportQbBtn.onclick = ()=>{
      const filteredForExport = getFilteredTickets();
      const headers = ['Customer','Invoice Date','Invoice No','Product/Service','Product/Service Description','Product/Service Quantity','Product/Service Rate','Product/Service Amount'];
      const csvRows = [headers.join(',')];
      const csvEscape = (val)=>{
        const s = String(val==null?'':val);
        if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
        return s;
      };
      filteredForExport.forEach(t=>{
        const equipSummary = t.equipment.map(e=>`${e.name}${e.qty>1?' x'+e.qty:''}`).join(', ');
        if(Array.isArray(t.wellCharges) && t.wellCharges.length > 0){
          // One invoice line per well charge - each pad/well is its own
          // billable event, even though they all share the same ticket.
          t.wellCharges.forEach(w=>{
            const amount = Number(w.amount)||0;
            let description = `Ticket #${t.ticketNumber||''} - ${t.rig||'Unassigned rig'}${w.label?' - '+w.label:''}`;
            if(equipSummary) description += ` - Equipment: ${equipSummary}`;
            csvRows.push([
              t.customer||'', w.date||t.deliveryDate||'', t.ticketNumber||'', 'Equipment Rental', description, 1, amount, amount
            ].map(csvEscape).join(','));
          });
        }else{
          // Legacy ticket predating well charges - export its one total.
          const amount = ticketTotal(t);
          let description = `Ticket #${t.ticketNumber||''} - ${t.rig||'Unassigned rig'}`;
          if(equipSummary) description += ` - Equipment: ${equipSummary}`;
          csvRows.push([
            t.customer||'', t.deliveryDate||'', t.ticketNumber||'', 'Equipment Rental', description, 1, amount, amount
          ].map(csvEscape).join(','));
        }
      });
      const blob = new Blob([csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `quickbooks-import-${todayStr()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
    const clearFocusBtn = document.getElementById('clear-focus-btn');
    if(clearFocusBtn) clearFocusBtn.onclick = ()=>{
      focusedTicketId = null;
      render();
    };
    document.querySelectorAll('[data-print]').forEach(b=>{
      b.onclick = ()=>{
        const t = tickets.find(x=>x.id===b.dataset.print);
        if(t) printTicket(t);
      };
    });
    document.querySelectorAll('[data-sign-link]').forEach(b=>{
      b.onclick = ()=>{
        if(!syncUrl){ alert('Cloud Sync needs to be connected first to generate a signature link.'); return; }
        const ticketId = b.dataset.signLink;
        const base = window.location.origin + window.location.pathname;
        const apiParam = (syncUrl === DEFAULT_SYNC_URL) ? '' : `&api=${encodeURIComponent(syncUrl)}`;
        const link = `${base}?sign=${encodeURIComponent(ticketId)}${apiParam}`;
        showSignatureLinkModal(link);
      };
    });
    document.querySelectorAll('[data-return-link]').forEach(b=>{
      b.onclick = ()=>{
        if(!syncUrl){ alert('Cloud Sync needs to be connected first to generate a return link.'); return; }
        const ticketId = b.dataset.returnLink;
        const base = window.location.origin + window.location.pathname;
        const apiParam = (syncUrl === DEFAULT_SYNC_URL) ? '' : `&api=${encodeURIComponent(syncUrl)}`;
        const link = `${base}?return=${encodeURIComponent(ticketId)}${apiParam}`;
        showSignatureLinkModal(link, true);
      };
    });
    document.querySelectorAll('[data-clear-return]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Clear this return confirmation? This removes the condition notes and signature captured from the return link.')) return;
        const ticketId = b.dataset.clearReturn;
        const t = tickets.find(x=>x.id===ticketId);
        if(t) delete t.returnConfirmation;
        await pushReturnUpdate(ticketId, [], '');
        render();
      };
    });
    document.querySelectorAll('[data-view-photo]').forEach(img=>{
      img.onclick = ()=>{
        const t = tickets.find(x=>x.id===img.dataset.viewPhoto);
        if(t && t.photo) viewPhoto(t.photo);
      };
    });
    document.querySelectorAll('[data-copy]').forEach(b=>{
      b.onclick = ()=>{
        const t = tickets.find(x=>x.id===b.dataset.copy);
        if(!t) return;
        editingId = null; // saving this will create a NEW ticket, not overwrite the original
        draftEquip = t.equipment.map(e=>({...e, id: eqid()}));
        resetDraftTicket(); // clears ticket number, customer, rig, notes, return date - only equipment carries over
        currentTab = 'new';
        render();
        const ticketNumInput = document.getElementById('f-ticketNumber');
        if(ticketNumInput){ ticketNumInput.focus(); ticketNumInput.select(); }
      };
    });
    document.querySelectorAll('[data-edit]').forEach(b=>{
      b.onclick = ()=>{
        const t = tickets.find(x=>x.id===b.dataset.edit);
        if(!t) return;
        editingId = t.id;
        draftEquip = t.equipment.map(e=>({...e, id: eqid()}));
        if(Array.isArray(t.wellCharges) && t.wellCharges.length > 0){
          draftWellCharges = t.wellCharges.map(w=>({...w}));
        }else{
          // Legacy ticket from before well charges existed - migrate its
          // old single total into one starter entry so the history isn't
          // lost, and it becomes the first row you can add more onto.
          const legacyTotal = ticketTotal(t);
          draftWellCharges = legacyTotal > 0
            ? [{ id: eqid(), date: t.deliveryDate||todayStr(), label: 'Prior total (migrated)', amount: String(legacyTotal) }]
            : [];
        }
        draftTicket = {
          ticketNumber: t.ticketNumber||'',
          customer: t.customer||'',
          rig: t.rig||'',
          deliveryDate: t.deliveryDate||todayStr(),
          returnDate: t.returnDate||'',
          notes: t.notes||'',
          photo: t.photo||'',
          signatureDelivered: t.signatureDelivered||'',
          signatureReceived: t.signatureReceived||''
        };
        currentTab = 'new';
        render();
      };
    });
    document.querySelectorAll('[data-return]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.return);
        if(t){ t.returnDate = todayStr(); t.updatedAt = nowIso(); await saveTickets(); render(); }
      };
    });
    document.querySelectorAll('[data-delete]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Delete this ticket? This cannot be undone.')) return;
        // Record the deletion for the backend BEFORE dropping it locally, so
        // the next push tells the server to remove it from the shared set and
        // remember it - otherwise a merge would just add it back from another
        // device's copy.
        if(!pendingDeletes.includes(b.dataset.delete)) pendingDeletes.push(b.dataset.delete);
        tickets = tickets.filter(x=>x.id!==b.dataset.delete);
        await saveTickets();
        render();
      };
    });

    // ── END PAD TRACKING ACTION HANDLERS ──────────────────────────────
  }

  // ── PAD TRACKING ACTION HANDLERS (shared across tickets + rig tracker) ──
  document.querySelectorAll('[data-well-billed]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.wellBilled);
        if(!t) return;
        const pad = getActivePad(t);
        if(!pad) return;
        const label = prompt('Well name or number (optional — press OK to skip):');
        if(label === null) return;
        if(!Array.isArray(pad.billedWells)) pad.billedWells = [];
        pad.billedWells.push({ date: todayStr(), label: (label||'').trim() });
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-rig-move]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.rigMove);
        if(!t) return;
        const pad = getActivePad(t);
        if(pad){
          const billed = Array.isArray(pad.billedWells) ? pad.billedWells.length : 0;
          if(billed < (pad.totalWells||0)){
            if(!confirm(`${pad.name} has ${billed} of ${pad.totalWells} wells billed. Move anyway? Unbilled wells may get missed.`)) return;
          }
        }
        // Ask what's happening — new pad or coming home?
        const goingToNewPad = confirm('Is the iron going to a new pad?\n\nOK = Yes, moving to a new pad\nCancel = No');
        if(goingToNewPad){
          const newName = prompt('New pad name:');
          if(!newName || !newName.trim()) return; // cancelled — nothing happens
          const newWells = parseInt(prompt('How many wells on this pad?'));
          if(!newWells || newWells < 1) return; // cancelled — nothing happens
          // Mark current pad complete now that we know they're committed
          if(pad){ pad.status = 'complete'; pad.completedDate = todayStr(); }
          if(!Array.isArray(t.pads)) t.pads = [];
          t.pads.push({
            id: 'p_' + Math.random().toString(36).slice(2,8),
            name: newName.trim(),
            totalWells: newWells,
            billedWells: [],
            status: 'active',
            startDate: todayStr()
          });
        } else {
          // They said it's NOT going to a new pad — confirm they want to mark returned
          const comingHome = confirm('Mark this equipment as returned?');
          if(!comingHome) return; // cancelled — nothing happens
          if(pad){ pad.status = 'complete'; pad.completedDate = todayStr(); }
          t.returnDate = todayStr();
        }
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-add-pad]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.addPad);
        if(!t) return;
        const name = prompt('Pad name:');
        if(!name || !name.trim()) return;
        const wells = parseInt(prompt('How many wells on this pad?'));
        if(!wells || wells < 1) return;
        if(!Array.isArray(t.pads)) t.pads = [];
        t.pads.push({
          id: 'p_' + Math.random().toString(36).slice(2,8),
          name: name.trim(),
          totalWells: wells,
          billedWells: [],
          status: 'active',
          startDate: todayStr()
        });
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-set-well-count]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.setWellCount);
        if(!t) return;
        const pad = getActivePad(t);
        if(!pad) return;
        const wells = parseInt(prompt(`How many wells on ${pad.name}?`));
        if(!wells || wells < 1) return;
        pad.totalWells = wells;
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });
    // ── END PAD TRACKING ACTION HANDLERS ──────────────────────────────

  if(currentTab === 'byrig'){
    const rigSearch = document.getElementById('rig-search-input');
    if(rigSearch){
      rigSearch.oninput = ()=>{
        rigSearchTerm = rigSearch.value;
        render();
        const el = document.getElementById('rig-search-input');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
    }
    document.querySelectorAll('[data-select-ticket]').forEach(cb=>{
      cb.onchange = ()=>{
        const id = cb.dataset.selectTicket;
        if(cb.checked) selectedTicketIds.add(id);
        else selectedTicketIds.delete(id);
        render();
      };
    });
    const bulkReturnBtn = document.getElementById('bulk-return-btn');
    if(bulkReturnBtn) bulkReturnBtn.onclick = async ()=>{
      const count = selectedTicketIds.size;
      if(count === 0) return;
      if(!confirm(`Mark ${count} ticket${count!==1?'s':''} as returned today?`)) return;
      const today = todayStr();
      tickets.forEach(t=>{
        if(selectedTicketIds.has(t.id)) t.returnDate = today;
      });
      selectedTicketIds.clear();
      await saveTickets();
      render();
    };
  }

  if(currentTab === 'inventory'){
    const invSearch = document.getElementById('inventory-search-input');
    if(invSearch){
      invSearch.oninput = ()=>{
        inventorySearchTerm = invSearch.value;
        render();
        const el = document.getElementById('inventory-search-input');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
    }
  }
}

async function onSaveTicket(){
  const ticketNumber = (draftTicket.ticketNumber||'').trim();
  const customer = (draftTicket.customer||'').trim();
  const rig = (draftTicket.rig||'').trim();
  const deliveryDate = draftTicket.deliveryDate || todayStr();
  const returnDate = draftTicket.returnDate || null;
  const notes = (draftTicket.notes||'').trim();
  const photo = draftTicket.photo || '';
  const signatureDelivered = draftTicket.signatureDelivered || '';
  const signatureReceived = draftTicket.signatureReceived || '';

  const wellCharges = draftWellCharges
    .filter(w=>w.date || w.amount)
    .map(w=>({ id: w.id, date: w.date || deliveryDate, label: (w.label||'').trim(), amount: Number(w.amount)||0 }));

  const equipment = draftEquip
    .map(e=>({name:e.name.trim(), serial:(e.serial||'').trim(), bandColor:(e.bandColor||'').trim(), qty:Number(e.qty)||0}))
    .filter(e=>e.name);

  if(!ticketNumber){ alert('Please enter a ticket number.'); return; }
  if(equipment.length===0){ alert('Please add at least one piece of equipment.'); return; }

  const duplicate = tickets.find(t=>
    t.id !== editingId &&
    (t.ticketNumber||'').trim().toLowerCase() === ticketNumber.toLowerCase()
  );
  if(duplicate){
    const proceed = confirm(`Ticket number "${ticketNumber}" is already used on another ticket (${duplicate.customer||'—'} / ${duplicate.rig||'—'}). Save anyway?`);
    if(!proceed) return;
  }

  let savedTicketId;
  if(editingId){
    savedTicketId = editingId;
    const idx = tickets.findIndex(t=>t.id===editingId);
    if(idx>-1){
      tickets[idx] = {...tickets[idx], ticketNumber, customer, rig, deliveryDate, returnDate, notes, photo, signatureDelivered, signatureReceived, wellCharges, equipment, updatedAt: nowIso()};
    }
    editingId = null;
  }else{
    savedTicketId = uid();
    // Build the initial pad entry if the user filled in pad info.
    const padName = (draftTicket.initialPadName||'').trim();
    const padWells = parseInt(draftTicket.initialPadWells)||0;
    const initialPads = (padName && padWells > 0) ? [{
      id: 'p_' + Math.random().toString(36).slice(2,8),
      name: padName,
      totalWells: padWells,
      billedWells: [],
      status: 'active',
      startDate: deliveryDate
    }] : [];
    tickets.push({id:savedTicketId, ticketNumber, customer, rig, deliveryDate, returnDate, notes, photo, signatureDelivered, signatureReceived, wellCharges, equipment, pads: initialPads, updatedAt: nowIso()});
  }

  addToCatalogIfNew(rigCatalog, rig);
  addToCatalogIfNew(customerCatalog, customer);

  // Save catalogs to local storage directly (pushToCloud already bundles
  // rig/customer data into the same request that saveTickets() below
  // triggers, so there's no need for three separate overlapping pushes).
  try{ localStorage.setItem(RIG_CATALOG_KEY, JSON.stringify(rigCatalog)); }catch(e){ console.error('Could not save rig list', e); }
  try{ localStorage.setItem(CUSTOMER_CATALOG_KEY, JSON.stringify(customerCatalog)); }catch(e){ console.error('Could not save customer list', e); }

  // Kick off saving (local write happens synchronously inside this, before
  // any network call) but don't wait on the cloud push before moving on -
  // otherwise a slow sync can finish later and force the tab back to
  // "tickets" even if the user has already navigated elsewhere by then.
  saveTickets();
  // Also keep the separate Signatures sheet (used by delivery-signing
  // links) in sync, so clearing/changing a signature here actually sticks
  // instead of a stale driver-submitted one reappearing on the next pull.
  pushSignatureUpdate(savedTicketId, signatureDelivered, signatureReceived);

  // Back up any photos or signatures captured in the main app to Google
  // Drive. Runs fully async in the background - the user is already back
  // on the tickets list by the time this starts uploading.
  if(photo || signatureDelivered || signatureReceived){
    backupTicketMedia(savedTicketId);
  }

  resetDraftEquip();
  resetDraftTicket();
  currentTab = 'tickets';
  render();
}

// Shows a simple full-screen password prompt and resolves true once the
// correct password is entered (and remembered for next time on this
// device), or never resolves if the tab is just closed instead.
// After 15 minutes with no interaction anywhere on the page (typing,
// clicking, tapping, scrolling), re-locks the app and shows the password
// gate again - without losing any in-memory state, so once unlocked again
// everything is exactly where it was.
let lastActivityTime = Date.now();
let inactivityLockActive = false;
const INACTIVITY_LOCK_MS = 15 * 60 * 1000;

function startInactivityAutoLock(){
  const markActivity = ()=>{ lastActivityTime = Date.now(); };
  ['keydown','mousedown','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, markActivity, { passive: true });
  });
  setInterval(async ()=>{
    if(inactivityLockActive) return;
    if(Date.now() - lastActivityTime >= INACTIVITY_LOCK_MS){
      inactivityLockActive = true;
      localStorage.removeItem('flowtech_equipment_tracker_unlocked');
      const unlocked = await showPasswordGate(APP_PASSWORD);
      if(unlocked){
        markActivity();
        inactivityLockActive = false;
        render();
      }
    }
  }, 30000); // check every 30 seconds - frequent enough without being wasteful
}

function showPasswordGate(correctPassword){
  return new Promise((resolve)=>{
    app.innerHTML = `
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--charcoal); padding:20px;">
        <div style="max-width:320px; width:100%; text-align:center;">
          <div class="password-gate-logo" style="margin-bottom:14px;">${LOGO_SVG_MARKUP}</div>
          <div style="font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; color:var(--amber); font-size:18px; margin-bottom:4px;">Flow-Tech Systems</div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#9FB3A5; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:20px;">Equipment Tracker</div>
          <input type="password" id="app-password-input" placeholder="Password" style="width:100%; padding:12px 14px; border-radius:6px; border:1.5px solid #3A4640; background:#1D2426; color:#F4F7F4; font-size:14px; text-align:center; margin-bottom:12px;">
          <button id="app-password-submit" style="width:100%; background:var(--amber); color:#14181A; border:none; padding:12px; border-radius:6px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:13px; cursor:pointer; font-weight:600;">Unlock</button>
          <div id="app-password-error" style="color:#E08080; font-size:12px; margin-top:10px; min-height:16px;"></div>
        </div>
      </div>
    `;
    const input = document.getElementById('app-password-input');
    const errorEl = document.getElementById('app-password-error');
    const attempt = ()=>{
      if(input.value === correctPassword){
        localStorage.setItem('flowtech_equipment_tracker_unlocked', 'yes');
        resolve(true);
      }else{
        errorEl.textContent = 'Incorrect password.';
        input.value = '';
        input.focus();
      }
    };
    document.getElementById('app-password-submit').onclick = attempt;
    input.onkeydown = (ev)=>{ if(ev.key === 'Enter') attempt(); };
    input.focus();
  });
}

async function init(){
  // If this device has anything left over from a previous failed
  // submission (driver closed the tab before it could retry), give it
  // one more attempt now, silently, before doing anything else.
  flushPendingSubmissions();

  // Check for a delivery-confirmation link (?sign=TICKET_ID&api=WEBAPP_URL)
  // before booting the normal app. This is a deliberately isolated mode: it
  // only ever sees ONE ticket, can't navigate anywhere else, and can't see
  // or touch equipment lists, other tickets, or app settings. Meant for
  // handing to a driver/delivery person who shouldn't have full app access.
  const params = new URLSearchParams(window.location.search);
  const signTicketId = params.get('sign');
  const signApiUrl = params.get('api') || DEFAULT_SYNC_URL;
  if(signTicketId && signApiUrl){
    await runSignatureCaptureMode(signTicketId, signApiUrl);
    return;
  }
  const returnTicketId = params.get('return');
  const returnApiUrl = params.get('api') || DEFAULT_SYNC_URL;
  if(returnTicketId && returnApiUrl){
    await runReturnCaptureMode(returnTicketId, returnApiUrl);
    return;
  }

  // Simple shared-password gate for the main app - not true security (this
  // check lives in the browser and could be bypassed by someone who knows
  // how to view page source), but a real deterrent against the link
  // accidentally ending up somewhere public. Stored in localStorage once
  // entered correctly, so it's only asked for once per device.
  if(localStorage.getItem('flowtech_equipment_tracker_unlocked') !== 'yes'){
    const unlocked = await showPasswordGate(APP_PASSWORD);
    if(!unlocked) return;
  }
  startInactivityAutoLock();

  resetDraftEquip();
  resetDraftTicket();
  await loadTickets();
  await loadCatalog();
  await loadEquipmentOwned();
  await loadAppSettings();
  await loadColorCatalog();
  await loadRigCatalog();
  await loadArchivedRigs();
  await loadCustomerCatalog();
  await loadTemplates();
  loadSyncUrl();
  render();
  if(syncUrl){
    await pullFromCloud(true);
    startAutoSync();
    if(currentTab === 'dashboard') fetchQuickBooksAR();
  }
}

// A self-contained, minimal page for capturing a signature on ONE specific
// ticket. No nav, no other tickets, no equipment editing - just that
// ticket's read-only details and two signature pads.
async function runSignatureCaptureMode(ticketId, apiUrl){
  app.innerHTML = `<div class="loading-note">Loading ticket...</div>`;

  let ticket = null;
  try{
    // Fetch only this one ticket via the narrow endpoint - never pulls
    // the full dataset, so a driver or customer with a signing link can't
    // see other tickets, rates, or customer info.
    const res = await fetch(`${apiUrl}${apiUrl.includes('?')?'&':'?'}action=ticket&id=${encodeURIComponent(ticketId)}`, { method: 'GET' });
    const data = await res.json();
    ticket = data.ticket || null;
    // Apply any separately-stored signature data.
    if(ticket && data.signature){
      if(data.signature.signatureDelivered) ticket.signatureDelivered = data.signature.signatureDelivered;
      if(data.signature.signatureReceived) ticket.signatureReceived = data.signature.signatureReceived;
    }
  }catch(e){
    console.error('Could not load ticket for signing', e);
  }

  if(!ticket){
    app.innerHTML = `
      <div style="max-width:480px; margin:60px auto; text-align:center; font-family:'Inter',sans-serif; padding:24px;">
        <h2 style="font-family:'Oswald',sans-serif; text-transform:uppercase;">Ticket Not Found</h2>
        <p style="color:var(--ink-soft);">This link may be out of date, or the ticket may have been removed. Please ask for a new link.</p>
      </div>
    `;
    return;
  }

  const equipRows = ticket.equipment.map(e=>`
    <tr>
      <td>${escHtml(e.name)}</td>
      <td>${escHtml(e.serial||'—')}</td>
      <td style="text-align:center;">${e.qty}</td>
    </tr>
  `).join('');

  app.innerHTML = `
    <div style="max-width:600px; margin:0 auto; padding:24px; font-family:'Inter',sans-serif;">
      <div style="border-bottom:4px solid var(--amber); padding-bottom:14px; margin-bottom:18px;">
        <h1 style="font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:20px; margin:0;">Delivery Confirmation</h1>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-top:4px;">Ticket #${escHtml(ticket.ticketNumber||'—')}</div>
      </div>

      <div style="font-size:14px; margin-bottom:16px;">
        <div><strong>Customer:</strong> ${escHtml(ticket.customer||'—')}</div>
        <div><strong>Rig / Lease:</strong> ${escHtml(ticket.rig||'—')}</div>
        <div><strong>Delivery Date:</strong> ${fmtDate(ticket.deliveryDate)}</div>
      </div>

      <table class="equip-table" style="margin-bottom:24px;">
        <thead><tr><th>Equipment</th><th>Serial #</th><th style="text-align:center;">Qty</th></tr></thead>
        <tbody>${equipRows}</tbody>
      </table>

      <label style="display:block; margin-bottom:8px; font-weight:600;">Photo of Delivered Equipment (optional)</label>
      <p style="font-size:12px; color:var(--ink-soft); margin-top:-4px; margin-bottom:10px;">On a phone, this opens your camera directly.</p>
      <input type="file" accept="image/*" capture="environment" id="sign-mode-photo-input" style="display:none;">
      <div id="sign-mode-photo-preview" style="margin-bottom:10px;"></div>
      <button class="ghost-btn" id="sign-mode-photo-btn" style="margin-bottom:20px;">Take / Choose Photo</button>

      <label style="display:block; margin-bottom:8px; font-weight:600;">Delivered By</label>
      <canvas id="sign-mode-delivered" width="320" height="120" class="signature-canvas" style="width:100%; max-width:400px;"></canvas>
      <button class="ghost-btn" id="sign-mode-clear-delivered" style="margin:8px 0 20px 0; font-size:11px; padding:5px 10px;">Clear</button>

      <label style="display:block; margin-bottom:8px; font-weight:600;">Received By</label>
      <canvas id="sign-mode-received" width="320" height="120" class="signature-canvas" style="width:100%; max-width:400px;"></canvas>
      <button class="ghost-btn" id="sign-mode-clear-received" style="margin:8px 0 20px 0; font-size:11px; padding:5px 10px;">Clear</button>

      <div id="sign-mode-status" style="font-size:13px; color:var(--ink-soft); margin-bottom:12px;"></div>
      <button class="primary-btn" id="sign-mode-submit">Submit Signature</button>
    </div>
  `;

  let deliveredData = ticket.signatureDelivered || '';
  let receivedData = ticket.signatureReceived || '';
  let deliveryPhotoData = '';

  document.getElementById('sign-mode-photo-btn').onclick = ()=>{
    document.getElementById('sign-mode-photo-input').click();
  };
  document.getElementById('sign-mode-photo-input').onchange = async ()=>{
    const file = document.getElementById('sign-mode-photo-input').files[0];
    if(!file) return;
    try{
      deliveryPhotoData = await resizeImageFile(file, 1000, 0.65);
      document.getElementById('sign-mode-photo-preview').innerHTML =
        `<img src="${deliveryPhotoData}" style="max-width:100%; max-height:200px; border-radius:6px; border:1.5px solid var(--line);">`;
    }catch(err){
      console.error('Photo processing failed', err);
      alert('Could not process that photo. Try a different image.');
    }
  };

  function setupPad(canvasId, onUpdate, existing){
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#1B211C';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(existing){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = existing;
    }
    let drawing = false;
    function getPos(ev){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (ev.clientX - rect.left) * scaleX, y: (ev.clientY - rect.top) * scaleY };
    }
    canvas.onpointerdown = (ev)=>{ drawing = true; const p = getPos(ev); ctx.beginPath(); ctx.moveTo(p.x,p.y); canvas.setPointerCapture(ev.pointerId); };
    canvas.onpointermove = (ev)=>{ if(!drawing) return; const p = getPos(ev); ctx.lineTo(p.x,p.y); ctx.stroke(); };
    const end = ()=>{ if(!drawing) return; drawing = false; onUpdate(canvas.toDataURL('image/png')); };
    canvas.onpointerup = end;
    canvas.onpointerleave = end;
    canvas.onpointercancel = end;
    return canvas;
  }

  setupPad('sign-mode-delivered', (d)=>{ deliveredData = d; }, deliveredData);
  setupPad('sign-mode-received', (d)=>{ receivedData = d; }, receivedData);

    document.getElementById('sign-mode-received').getContext('2d').clearRect(0,0,320,120);
  };

  document.getElementById('sign-mode-submit').onclick = async ()=>{
    const statusEl = document.getElementById('sign-mode-status');
    const submitBtn = document.getElementById('sign-mode-submit');
    if(!deliveredData && !receivedData){
      statusEl.textContent = 'Please sign at least one field before submitting.';
      return;
    }
    submitBtn.disabled = true;
    statusEl.textContent = 'Submitting...';
    const requestBody = { signatureUpdate: { ticketId, signatureDelivered: deliveredData, signatureReceived: receivedData, deliveryPhoto: deliveryPhotoData, source: 'driver' } };
    try{
      // Only send this one ticket's signature data, to a small dedicated
      // row - never touches or resends the full ticket list, so there's
      // no risk of clobbering other changes or hitting any size limit.
      await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestBody)
      });
      app.innerHTML = `
        <div style="max-width:480px; margin:60px auto; text-align:center; font-family:'Inter',sans-serif; padding:24px;">
          <h2 style="font-family:'Oswald',sans-serif; text-transform:uppercase; color:#1E8A29;">Signature Submitted</h2>
          <p style="color:var(--ink-soft);">Thank you - ticket #${escHtml(ticket.ticketNumber||'')} has been updated. You may close this page.</p>
        </div>
      `;
    }catch(e){
      // No connection right now - rig sites often have weak signal. Save
      // this on the device and keep retrying automatically instead of
      // losing it if the driver just closes the tab.
      queuePendingSubmission(apiUrl, requestBody);
      app.innerHTML = `
        <div style="max-width:480px; margin:60px auto; text-align:center; font-family:'Inter',sans-serif; padding:24px;">
          <h2 style="font-family:'Oswald',sans-serif; text-transform:uppercase; color:var(--amber);">Saved - Will Send Automatically</h2>
          <p style="color:var(--ink-soft);">No connection right now, but your signature for ticket #${escHtml(ticket.ticketNumber||'')} has been saved on this device. It'll send automatically as soon as you're back online - you can close this page or leave it open.</p>
          <p id="retry-status" style="color:var(--ink-soft); font-size:13px; margin-top:16px;"></p>
        </div>
      `;
      startPendingSubmissionRetry((result)=>{
        const retryStatusEl = document.getElementById('retry-status');
        if(retryStatusEl && result.succeeded > 0){
          retryStatusEl.textContent = 'Sent successfully - thank you!';
          retryStatusEl.style.color = '#1E8A29';
        }
      });
    }
  };
}

      startPendingSubmissionRetry((result)=>{
        const retryStatusEl = document.getElementById('retry-status');
        if(retryStatusEl && result.succeeded > 0){
          retryStatusEl.textContent = 'Sent successfully - thank you!';
          retryStatusEl.style.color = '#1E8A29';
        }
      });
    }
  };
}

init();
})();
</script>
</body>
</html>
