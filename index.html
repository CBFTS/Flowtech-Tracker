function renderByRig(){
  const outTickets = tickets.filter(t=>!t.returnDate);
  if(outTickets.length === 0){
    return `<div class="empty-state">
      <div class="stamp">Nothing Out</div>
      <p>All equipment has been marked returned. Nothing currently out on a rig.</p>
    </div>`;
  }
  const byRig = {};
  outTickets.forEach(t=>{
    const rig = t.rig || 'Unassigned rig';
    if(!byRig[rig]) byRig[rig] = [];
    byRig[rig].push(t);
  });

  let rigNames = Object.keys(byRig).sort();
  if(rigSearchTerm){
    const s = rigSearchTerm.toLowerCase();
    rigNames = rigNames.filter(rig=>rig.toLowerCase().includes(s));
  }

  const noMatches = rigNames.length === 0;

  let groups = rigNames.map(rig=>{
    const rigTickets = byRig[rig];
    const itemCount = rigTickets.reduce((s,t)=>s+t.equipment.length,0);
    const customer = rigTickets[0]?.customer || '—';

    // Find the primary ticket for pad tracking (most recent delivery)
    const primaryTicket = rigTickets.slice().sort((a,b)=>(b.deliveryDate||'').localeCompare(a.deliveryDate||''))[0];
    const activePad = primaryTicket ? getActivePad(primaryTicket) : null;

    // Pad status summary for the rig header area
    let padHtml = '';
    if(activePad){
      const billed = Array.isArray(activePad.billedWells) ? activePad.billedWells.length : 0;
      const total = activePad.totalWells || 0;
      const pct = total > 0 ? Math.round((billed / total) * 100) : 0;
      const complete = billed >= total && total > 0;
      const daysSince = daysSinceLastBilled(activePad);
      const staleWarning = daysSince !== null && daysSince > 14;

      padHtml += `<div style="background:#FCFAF3; border:1.5px solid var(--line); border-radius:6px; padding:12px; margin:8px 0;">`;
      padHtml += `<div style="display:flex; justify-content:space-between; align-items:center;">`;
      padHtml += `<div style="font-weight:600; font-size:14px;">${escHtml(activePad.name)}</div>`;
      padHtml += `<span style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:${complete?'var(--green)':'var(--ink-soft)'};">${billed} of ${total} billed${complete?' ✓':''}</span>`;
      padHtml += `</div>`;
      padHtml += `<div style="background:var(--paper-2); border-radius:4px; height:6px; margin:6px 0;">`;
      padHtml += `<div style="background:${complete?'var(--green)':'var(--amber)'}; border-radius:4px; height:100%; width:${pct}%; transition:width 0.3s;"></div>`;
      padHtml += `</div>`;
      if(daysSince !== null){
        padHtml += `<div style="font-size:11px; color:${staleWarning?'#B5432A':'var(--ink-soft)'};">${staleWarning?'⚠ ':''}Last billed ${daysSince} day${daysSince!==1?'s':''} ago</div>`;
      }
      if(billed > 0){
        padHtml += `<div style="margin-top:6px; font-size:12px; color:var(--ink-soft);">`;
        activePad.billedWells.forEach((w, wi)=>{
          padHtml += `<span style="display:inline-flex; align-items:center; gap:5px; background:var(--paper-2); border-radius:3px; padding:2px 4px 2px 6px; margin:2px 4px 2px 0;">`;
          padHtml += `${fmtDate(w.date)}${w.label?' — '+escHtml(w.label):''}`;
          padHtml += `<button data-unbill-well="${primaryTicket.id}" data-well-index="${wi}" title="Remove this billed well" style="background:none; border:none; padding:0 2px; margin:0; cursor:pointer; color:var(--ink-soft); font-size:13px; line-height:1; font-family:inherit;">&times;</button>`;
          padHtml += `</span>`;
        });
        padHtml += `</div>`;
      }
      padHtml += `<div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">`;
      if(!complete){
        padHtml += `<button class="primary-btn" data-well-billed="${primaryTicket.id}" style="font-size:12px; padding:8px 14px;">Well Billed</button>`;
      }
      padHtml += `<button class="ghost-btn" data-rig-move="${primaryTicket.id}" style="font-size:12px; padding:7px 14px;">${complete?'Pad Complete — Rig Move':'Rig Move'}</button>`;
      padHtml += `</div>`;

      // Completed pad history
      const completedPads = Array.isArray(primaryTicket.pads) ? primaryTicket.pads.filter(p=>p.status==='complete') : [];
      if(completedPads.length > 0){
        padHtml += `<div style="margin-top:10px; border-top:1px solid var(--line); padding-top:8px;">`;
        padHtml += `<div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;">Pad History</div>`;
        completedPads.forEach(p=>{
          const b = Array.isArray(p.billedWells) ? p.billedWells.length : 0;
          padHtml += `<div style="font-size:12px; color:var(--ink-soft); padding:3px 0;">${escHtml(p.name)} — ${b} of ${p.totalWells} wells — ${fmtDate(p.startDate)} to ${fmtDate(p.completedDate||'')}</div>`;
        });
        padHtml += `</div>`;
      }
      padHtml += `</div>`;
    } else if(primaryTicket) {
      padHtml = `<div style="background:#FCFAF3; border:1.5px solid var(--line); border-radius:6px; padding:12px; margin:8px 0;">
        <div style="font-size:13px; color:var(--ink-soft); margin-bottom:8px;">No pad tracking on this rig yet.</div>
        <button class="ghost-btn" data-add-pad="${primaryTicket.id}" style="font-size:12px; padding:7px 14px;">+ Add Pad</button>
      </div>`;
    }

    const ticketBlocks = rigTickets.map(t=>{
      const days = daysBetween(t.deliveryDate, todayStr());
      const overdue = isTicketOverdue(t);
      const equipLines = t.equipment.map(e=>`
        <div class="rig-equip-row">
          <div>
            <div class="rig-equip-name">${escHtml(e.name)} ${e.qty>1?('× '+e.qty):''}${e.serial?` <span style="color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400;">(S/N ${escHtml(e.serial)})</span>`:''}</div>
            ${e.bandColor?`<div class="rig-equip-meta">${colorSwatch(e.bandColor)}${escHtml(e.bandColor)} band</div>`:''}
          </div>
        </div>
      `).join('');
      return `
        <div class="rig-ticket-block" ${overdue?'style="border-left:3px solid #B5432A;"':''}>
          <label class="rig-ticket-header">
            <span class="ticket-num" style="margin-left:0;">#${escHtml(t.ticketNumber||'—')}</span>
            <span class="rig-equip-meta" style="margin-left:8px;">${escHtml(t.customer||'—')} · Out ${days} days</span>
            ${overdue?`<span class="status-pill" style="background:#FCEBEA; color:#B5432A; margin-left:auto;">Overdue</span>`:''}
          </label>
          <details class="equip-collapse">
            <summary style="cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); padding:6px 12px; list-style:none; display:flex; align-items:center; gap:6px; background:#FFFDF8;">
              <span style="font-size:14px; transition:transform 0.2s;">▸</span> ${t.equipment.length} equipment item${t.equipment.length!==1?'s':''}
            </summary>
            ${equipLines}
          </details>
        </div>
      `;
    }).join('');
    return `<div class="rig-group">
      <h3><span>${escHtml(rig)}</span><span>${itemCount} item${itemCount!==1?'s':''}</span></h3>
      ${padHtml}
      ${ticketBlocks}
    </div>`;
  }).join('');

  return `
    <div class="search-bar">
      <input type="text" id="rig-search-input" placeholder="Filter by rig name..." value="${escAttr(rigSearchTerm)}">
    </div>
    <h2 class="section-title">Rig Tracker</h2>
    ${noMatches ? `<p style="font-size:13px; color:var(--ink-soft);">No rigs match "${escHtml(rigSearchTerm)}".</p>` : groups}
  `;
}

function renderInventory(){
  const outTickets = tickets.filter(t=>!t.returnDate);

  if(outTickets.length === 0){
    // Still offer the count sheet here - an empty yard is the easiest time
    // to count, so this is exactly when it's most useful.
    return `<div class="empty-state">
      <div class="stamp">Nothing Out</div>
      <p>All equipment has been marked returned. Nothing currently out to show in inventory.</p>
      <button class="ghost-btn" id="print-count-sheet-btn" style="margin-top:12px;">Print Count Sheet</button>
    </div>`;
  }

  // Aggregate every equipment line across all open tickets, grouped by name.
  const byName = {};
  outTickets.forEach(t=>{
    t.equipment.forEach(e=>{
      const key = e.name || 'Unnamed';
      if(!byName[key]) byName[key] = { totalQty: 0, lines: [] };
      byName[key].totalQty += Number(e.qty)||0;
      byName[key].lines.push({
        qty: e.qty, serial: e.serial, bandColor: e.bandColor,
        ticketNumber: t.ticketNumber, rig: t.rig, customer: t.customer, deliveryDate: t.deliveryDate
      });
    });
  });

  let names = Object.keys(byName).sort((a,b)=>a.localeCompare(b));
  if(inventorySearchTerm){
    const s = inventorySearchTerm.toLowerCase();
    names = names.filter(n=>n.toLowerCase().includes(s));
  }

  const totalUnitsOut = names.reduce((sum,n)=>sum+byName[n].totalQty, 0);
  const distinctTypesOut = Object.keys(byName).length;
  const overCapacityCount = Object.keys(byName).filter(n=>{
    const owned = equipmentOwned[n];
    return owned != null && owned > 0 && byName[n].totalQty > owned;
  }).length;

  const noMatches = names.length === 0;

  const groups = names.map(name=>{
    const info = byName[name];
    const owned = equipmentOwned[name];
    const hasOwned = owned != null && owned > 0;
    const pct = hasOwned ? Math.min(100, Math.round((info.totalQty/owned)*100)) : 0;
    const overCapacity = hasOwned && info.totalQty > owned;
    const utilizationLabel = hasOwned
      ? `${info.totalQty} of ${owned} out${overCapacity?' (over capacity!)':''}`
      : `${info.totalQty} unit${info.totalQty!==1?'s':''} out`;
    const barColor = overCapacity ? '#B5432A' : (pct >= 80 ? '#D9822B' : '#33D63A');
    const rows = info.lines.map(line=>{
      const days = daysBetween(line.deliveryDate, todayStr());
      return `
        <div class="rig-equip-row">
          <div>
            <div class="rig-equip-name">${escHtml(line.rig||'Unassigned rig')} ${line.qty>1?('× '+line.qty):''}${line.serial?` <span style="color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400;">(S/N ${escHtml(line.serial)})</span>`:''}</div>
            <div class="rig-equip-meta">Ticket #${escHtml(line.ticketNumber||'—')} · ${escHtml(line.customer||'—')}${line.bandColor?` · ${colorSwatch(line.bandColor)}${escHtml(line.bandColor)} band`:''}</div>
          </div>
          <div style="text-align:right;">
            <div class="rig-equip-meta">${days} days out</div>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="rig-group">
      <h3><span>${escHtml(name)}</span><span>${utilizationLabel}</span></h3>
      ${hasOwned?`<div style="height:5px; background:#E8EDE8;"><div style="height:100%; width:${pct}%; background:${barColor};"></div></div>`:''}
      ${rows}
    </div>`;
  }).join('');

  return `
    <div class="search-bar">
      <input type="text" id="inventory-search-input" placeholder="Filter by equipment name..." value="${escAttr(inventorySearchTerm)}">
    </div>
    <div class="summary-cards" style="grid-template-columns:repeat(${overCapacityCount>0?3:2},1fr);">
      <div class="summary-card"><div class="num">${distinctTypesOut}</div><div class="lbl">Equipment Types Out</div></div>
      <div class="summary-card"><div class="num">${totalUnitsOut}</div><div class="lbl">Total Units Out</div></div>
      ${overCapacityCount>0?`<div class="summary-card" style="border-color:#B5432A;"><div class="num" style="color:#B5432A;">${overCapacityCount}</div><div class="lbl">Over Capacity</div></div>`:''}
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <h2 class="section-title" style="margin-bottom:0;">Inventory Currently Out, By Equipment</h2>
      <button class="ghost-btn" id="print-count-sheet-btn" style="font-size:12px;">Print Count Sheet</button>
    </div>
    ${noMatches ? `<p style="font-size:13px; color:var(--ink-soft);">No equipment matches "${escHtml(inventorySearchTerm)}".</p>` : groups}
  `;
}

/* ── REVENUE BY CUSTOMER (QUICKBOOKS) ──────────────────────────────
   QuickBooks knows who got invoiced. The tracker knows who the work was
   actually for. This joins the two, so revenue billed through a
   pass-through vendor still lands under the operator that drilled it.

   The join key is text: a rig or pad name appearing anywhere on the
   invoice - document number, memo, private note, or a line description.
   Anything that can't be matched goes to "Unattributed" rather than being
   quietly folded into a customer it might not belong to. If that number
   is large, the fix is putting the rig or pad name on the invoice in
   QuickBooks, not changing the math here.
*/

function normalizeForMatch(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}

// Builds a rig-name and pad-name lookup pointing at the operator behind
// each one, drawn from ticket history. Later tickets win, so if a rig
// moves to a different operator the current one is what gets used.
function buildOperatorLookup(){
  const sorted = tickets.slice().sort((a,b)=>String(a.deliveryDate||'').localeCompare(String(b.deliveryDate||'')));
  const byKey = {};
  sorted.forEach(t=>{
    const operator = t.customer || '';
    if(!operator) return;
    if(t.rig){
      const k = normalizeForMatch(t.rig);
      if(k.length >= 3) byKey[k] = { key:k, operator, label:t.rig, kind:'rig' };
    }
    if(Array.isArray(t.pads)){
      t.pads.forEach(p=>{
        if(!p || !p.name) return;
        const k = normalizeForMatch(p.name);
        if(k.length >= 3) byKey[k] = { key:k, operator, label:p.name, kind:'pad' };
      });
    }
  });
  // Longest keys first, so a specific pad name wins over a shorter name
  // that happens to be a substring of it.
  return Object.keys(byKey).map(k=>byKey[k]).sort((a,b)=>b.key.length - a.key.length);
}

// Everything the server could find on the invoice that might carry a rig or
// pad name, as one string. Falls back to the older per-field shape so a
// stale cached response from the previous version still works.
function invoiceSearchText(inv){
  if(inv.searchText) return inv.searchText;
  return [inv.docNumber, inv.memo, inv.privateNote, inv.lines, inv.customer].filter(Boolean).join(' | ');
}

// QuickBooks writes a sub-customer (a job) as "Parent:Child". For deciding
// whether an invoice went through a pass-through vendor, only the parent
// matters - the child half is usually the rig, which is exactly what the
// matcher wants to read.
function parentCustomerName(name){
  return String(name||'').split(':')[0].trim();
}

// Deliberately forgiving: a stored "West Texas Premix Pits" still matches a
// QuickBooks customer named "West Texas Premix Pits LLC", and vice versa.
// Exact-name matching is what made this quietly fail before.
function isPassThroughCustomer(name){
  const n = normalizeForMatch(parentCustomerName(name));
  if(!n) return false;
  return getPassThroughList().some(v=>{
    const vn = normalizeForMatch(v);
    if(!vn) return false;
    return n === vn || n.indexOf(vn) !== -1 || vn.indexOf(n) !== -1;
  });
}

function attributeInvoice(inv, lookup){
  const haystack = normalizeForMatch(invoiceSearchText(inv));
  if(!haystack) return null;
  for(let i=0;i<lookup.length;i++){
    if(haystack.indexOf(lookup[i].key) !== -1) return lookup[i];
  }
  return null;
}

function renderRevenueByCustomer(){
  if(!syncUrl) return '';

  const heading = `<h2 class="section-title" style="margin-top:24px;">Revenue by Customer (QuickBooks)</h2>`;
  const box = (inner)=>`${heading}<div style="background:#fff; border:1.5px solid #E8EDE8; border-radius:8px; padding:16px;">${inner}</div>`;

  if(!qbRevenueData){
    return box(`<div style="font-size:13px; color:#5B6660;">Loading revenue from QuickBooks...</div>`);
  }
  if(!qbRevenueData.connected){
    return box(`<div style="font-size:13px; color:#5B6660;">QuickBooks isn't connected yet - revenue will show here once it is.${qbRevenueData.error?`<div style="color:#B5432A; margin-top:6px;">${escHtml(qbRevenueData.error)}</div>`:''}</div>`);
  }
  if(qbRevenueData.error){
    return box(`<div style="font-size:13px; color:#B5432A;">QuickBooks error: ${escHtml(qbRevenueData.error)}</div>`);
  }

  const invoices = Array.isArray(qbRevenueData.invoices) ? qbRevenueData.invoices : [];
  if(invoices.length === 0){
    return box(`<div style="font-size:13px; color:#5B6660;">No invoices dated ${escHtml(qbRevenueData.startDate||'this year')} or later.</div>`);
  }

  const lookup = buildOperatorLookup();
  const groups = {};   // operator/customer name -> { total, count, viaVendor, direct }
  let unattributed = { total:0, count:0, items:[] };
  let vendorTotal = 0;

  invoices.forEach(inv=>{
    const billedTo = inv.customer || 'Unknown';
    // Compare on the parent name so sub-customer jobs like
    // "West Texas Premix Pits:H&P 517" still register as vendor-billed.
    const parent = parentCustomerName(billedTo);
    const isPassThrough = isPassThroughCustomer(billedTo);

    if(isPassThrough) vendorTotal += inv.amount || 0;

    // An invoice-number rule is an explicit decision about who the work
    // belongs to, so it beats everything else - including which customer
    // QuickBooks has the invoice written against.
    const rule = matchInvoiceRule(inv);
    if(rule){
      const name = rule.operator;
      if(!groups[name]) groups[name] = { total:0, count:0, viaVendor:0, direct:0, byRule:0, vendors:{}, prefixes:{} };
      groups[name].total += inv.amount || 0;
      groups[name].count++;
      groups[name].byRule += inv.amount || 0;
      groups[name].prefixes[rule.prefix] = true;
      if(isPassThrough) groups[name].vendors[parent] = true;
      return;
    }

    if(isPassThrough){
      const match = attributeInvoice(inv, lookup);
      if(!match){
        unattributed.total += inv.amount || 0;
        unattributed.count++;
        unattributed.items.push(inv);
        return;
      }
      const name = match.operator;
      if(!groups[name]) groups[name] = { total:0, count:0, viaVendor:0, direct:0, byRule:0, vendors:{}, prefixes:{} };
      groups[name].total += inv.amount || 0;
      groups[name].count++;
      groups[name].viaVendor += inv.amount || 0;
      groups[name].vendors[parent] = true;
    } else {
      // Group direct customers by parent too, so a customer with jobs under
      // it lands on one line instead of scattering into one row per job.
      const key = parent || billedTo;
      if(!groups[key]) groups[key] = { total:0, count:0, viaVendor:0, direct:0, byRule:0, vendors:{}, prefixes:{} };
      groups[key].total += inv.amount || 0;
      groups[key].count++;
      groups[key].direct += inv.amount || 0;
    }
  });

  const entries = Object.keys(groups).map(k=>[k, groups[k]]).sort((a,b)=>b[1].total - a[1].total);
  const grandTotal = qbRevenueData.totalRevenue || 0;
  const maxTotal = entries.length ? entries[0][1].total : 0;

  let rows = '';
  entries.forEach(([name, g])=>{
    const barWidth = maxTotal > 0 ? Math.min(100, Math.round((g.total / maxTotal) * 100)) : 0;
    const vendorNames = Object.keys(g.vendors);
    const prefixNames = Object.keys(g.prefixes||{});
    const bits = [];
    if(g.byRule > 0) bits.push(`${fmtMoney(g.byRule)} by invoice # (${escHtml(prefixNames.join(', '))})`);
    if(g.viaVendor > 0) bits.push(`${fmtMoney(g.viaVendor)} via ${escHtml(vendorNames.join(', '))}`);
    if(g.direct > 0 && bits.length) bits.push(`${fmtMoney(g.direct)} direct`);
    const tag = bits.length
      ? `<div style="font-size:11px; color:#5B6660; margin-top:2px;">${bits.join(' &middot; ')}</div>`
      : '';
    // Any row that came straight from QuickBooks (rather than being derived
    // by splitting a vendor) can itself be marked as a pass-through vendor.
    // This is how you tell the app the real spelling of a vendor name
    // without anybody having to guess it.
    const splitBtn = g.direct > 0
      ? `<button data-split-vendor="${escAttr(name)}" style="background:none; border:none; padding:0; margin-left:8px; color:#2E7D32; font-size:11px; text-decoration:underline; cursor:pointer; font-family:inherit;">split by operator</button>`
      : '';

    rows += `<div style="padding:10px 0; border-bottom:1px solid #E8EDE8;">
      <div style="display:grid; grid-template-columns:1fr 60px 100px; gap:8px; font-size:13px; align-items:center;">
        <div><div style="font-weight:600;">${escHtml(name)}${splitBtn}</div>${tag}</div>
        <div style="text-align:center; color:#5B6660;">${g.count}</div>
        <div style="text-align:right; font-weight:600;">${fmtMoney(g.total)}</div>
      </div>
      <div style="background:#E8EDE8; border-radius:4px; height:6px; overflow:hidden; margin-top:8px;">
        <div style="height:100%; width:${barWidth}%; background:#33D63A; border-radius:4px; min-width:2px;"></div>
      </div>
    </div>`;
  });

  if(unattributed.count > 0){
    // Expandable detail: shows the actual text pulled off each unmatched
    // invoice next to the rig and pad names being matched against. If the
    // rig name is visible in that text but still isn't matching, the names
    // are spelled differently in QuickBooks than in the tracker - and this
    // is where you can see it side by side.
    let detail = '';
    if(showUnattributedDetail){
      let items = '';
      unattributed.items.slice(0, 25).forEach(inv=>{
        const raw = invoiceSearchText(inv);
        items += `<div style="padding:8px 0; border-top:1px dashed #E6D080;">
          <div style="display:flex; justify-content:space-between; gap:10px; font-size:12px; font-weight:600; color:#5C4A08;">
            <span>${escHtml(inv.docNumber || '(no invoice #)')} &middot; ${escHtml(inv.date||'')}</span>
            <span>${fmtMoney(inv.amount||0)}</span>
          </div>
          <div style="font-size:11px; color:#5B6660; margin-top:3px; word-break:break-word;">${raw ? escHtml(raw) : '<em>No text found on this invoice at all.</em>'}</div>
        </div>`;
      });
      const moreNote = unattributed.items.length > 25
        ? `<div style="font-size:11px; color:#8A6D10; padding-top:8px;">Showing the first 25 of ${unattributed.items.length}.</div>` : '';
      const knownNames = lookup.slice(0, 40).map(l=>l.label);
      detail = `<div style="background:#FFF8E6; border:1px solid #E6D080; border-radius:6px; padding:10px 12px; margin-top:8px;">
        ${items}${moreNote}
        <div style="font-size:11px; color:#5B6660; margin-top:10px; padding-top:8px; border-top:1px solid #E6D080;">
          <strong>Matching against ${lookup.length} name${lookup.length!==1?'s':''} from your tickets:</strong> ${escHtml(knownNames.join(', '))}${lookup.length>40?' ...':''}
        </div>
      </div>`;
    }

    rows += `<div style="padding:10px 0; border-bottom:1px solid #E8EDE8;">
      <div style="display:grid; grid-template-columns:1fr 60px 100px; gap:8px; font-size:13px; align-items:center;">
        <div>
          <div style="font-weight:600; color:#8A6D10;">Unattributed</div>
          <div style="font-size:11px; color:#8A6D10;">Billed through ${escHtml(getPassThroughList().join(', '))}, no rig or pad name recognized
            <button id="toggle-unattributed-detail" style="background:none; border:none; padding:0 0 0 4px; color:#8A6D10; font-size:11px; text-decoration:underline; cursor:pointer; font-family:inherit;">${showUnattributedDetail?'hide':'show me why'}</button>
          </div>
        </div>
        <div style="text-align:center; color:#8A6D10;">${unattributed.count}</div>
        <div style="text-align:right; font-weight:600; color:#8A6D10;">${fmtMoney(unattributed.total)}</div>
      </div>
      ${detail}
    </div>`;
  }

  const fetchedTime = qbRevenueData.fetchedAt ? new Date(qbRevenueData.fetchedAt).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : '';
  const startLabel = qbRevenueData.startDate ? qbRevenueData.startDate.substring(0,4) : '';

  // Shows which names are currently being treated as pass-through vendors,
  // and gives a way back out. Without this, marking a customer by mistake
  // would make its row vanish with no obvious way to undo it.
  // Editable invoice-number rules. Kept collapsed by default so the section
  // stays a report rather than a settings screen, but one click away because
  // these are the rules doing most of the attribution work.
  const rules = getInvoiceRules();
  const operatorOptions = knownOperatorNames();
  let rulesPanel = '';
  if(showInvoiceRules){
    let ruleRows = '';
    rules.forEach((r,i)=>{
      const opts = operatorOptions.map(n=>`<option value="${escAttr(n)}"${normalizeForMatch(n)===normalizeForMatch(r.operator)?' selected':''}>${escHtml(n)}</option>`).join('');
      const missing = r.operator && !operatorOptions.some(n=>normalizeForMatch(n)===normalizeForMatch(r.operator));
      ruleRows += `<div style="display:flex; align-items:center; gap:8px; padding:6px 0; flex-wrap:wrap;">
        <span style="font-size:11px; color:#5B6660;">Invoice # starts with</span>
        <input data-rule-prefix="${i}" value="${escAttr(r.prefix||'')}" style="width:80px; padding:4px 6px; border:1px solid #D6E2D6; border-radius:4px; font-size:12px; text-transform:uppercase; font-family:inherit;">
        <span style="font-size:11px; color:#5B6660;">&rarr;</span>
        <select data-rule-operator="${i}" style="padding:4px 6px; border:1px solid #D6E2D6; border-radius:4px; font-size:12px; font-family:inherit;">
          ${missing?`<option value="${escAttr(r.operator)}" selected>${escHtml(r.operator)} (not in tracker)</option>`:''}
          ${opts}
        </select>
        <button data-rule-remove="${i}" title="Remove this rule" style="background:none; border:none; color:#B5432A; cursor:pointer; font-size:14px; padding:0 4px; font-family:inherit;">&times;</button>
      </div>`;
    });
    if(!rules.length) ruleRows = `<div style="font-size:12px; color:#5B6660; padding:6px 0;">No rules yet.</div>`;
    rulesPanel = `<div style="background:#F7FAF7; border:1px solid #D6E2D6; border-radius:6px; padding:10px 12px; margin-top:10px;">
      ${ruleRows}
      <button id="add-invoice-rule" class="ghost-btn" style="font-size:12px; margin-top:6px;">Add rule</button>
      <div style="font-size:11px; color:#5B6660; margin-top:8px;">Matched against the start of the QuickBooks invoice number, ignoring case. Checked before rig and pad names, and before which customer the invoice is written to.</div>
    </div>`;
  }

  const activeVendors = getPassThroughList();
  const vendorChips = activeVendors.length ? `
    <div style="margin-top:12px; padding-top:10px; border-top:1px solid #E8EDE8; font-size:11px; color:#5B6660;">
      Splitting by operator:
      ${activeVendors.map(v=>`<span style="display:inline-block; background:#EEF4EE; border:1px solid #D6E2D6; border-radius:12px; padding:2px 8px; margin:2px 4px 2px 0;">${escHtml(v)}<button data-unsplit-vendor="${escAttr(v)}" title="Stop splitting this one" style="background:none; border:none; padding:0 0 0 6px; color:#8A6D10; cursor:pointer; font-family:inherit; font-size:12px;">&times;</button></span>`).join('')}
    </div>` : '';

  return `
    ${heading}
    <div class="summary-cards" style="grid-template-columns:repeat(3,1fr);">
      <div class="summary-card"><div class="num">${fmtMoney(grandTotal)}</div><div class="lbl">Invoiced ${escHtml(startLabel)} YTD</div></div>
      <div class="summary-card"><div class="num">${qbRevenueData.invoiceCount||0}</div><div class="lbl">Invoices</div></div>
      <div class="summary-card"><div class="num">${fmtMoney(vendorTotal)}</div><div class="lbl">Through Vendor</div></div>
    </div>
    <div style="background:#fff; border:1.5px solid #E8EDE8; border-radius:8px; padding:16px;">
      <div style="display:grid; grid-template-columns:1fr 60px 100px; gap:8px; padding-bottom:8px; border-bottom:2px solid #E8EDE8; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#5B6660;">
        <div>Operator</div><div style="text-align:center;">Inv</div><div style="text-align:right;">Revenue</div>
      </div>
      ${rows}
      <div style="margin-top:12px; padding-top:10px; border-top:1px solid #E8EDE8; font-size:11px; color:#5B6660;">
        ${rules.length} invoice number rule${rules.length!==1?'s':''} active
        <button id="toggle-invoice-rules" style="background:none; border:none; padding:0 0 0 4px; color:#2E7D32; font-size:11px; text-decoration:underline; cursor:pointer; font-family:inherit;">${showInvoiceRules?'hide':'edit'}</button>
      </div>
      ${rulesPanel}
      ${vendorChips}
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;">
        <div style="font-size:11px; color:#5B6660;">
          Live from QuickBooks${fetchedTime?' as of '+fetchedTime:''}. Vendor-billed work is credited to the operator by matching rig and pad names on the invoice.
          ${qbRevenueData.truncated?'<span style="color:#B5432A;"> Showing the first 10,000 invoices only.</span>':''}
        </div>
        <button class="ghost-btn" id="refresh-qb-revenue-btn" style="font-size:12px;">Refresh</button>
      </div>
    </div>
  `;
}

function renderReports(){
  const now = new Date();
  const thisMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const thisYear = now.getFullYear();
  const thisQuarterStart = new Date(thisYear, Math.floor(now.getMonth()/3)*3, 1);
  const thisQuarterLabel = 'Q' + (Math.floor(now.getMonth()/3)+1) + ' ' + thisYear;

  // Collect all wells billed across all tickets
  const allWells = [];
  const allPads = [];
  const customerStats = {};
  const rigStats = {};

  tickets.forEach(t=>{
    if(!Array.isArray(t.pads)) return;
    t.pads.forEach(pad=>{
      const billed = Array.isArray(pad.billedWells) ? pad.billedWells : [];
      const padDays = pad.completedDate && pad.startDate ? daysBetween(pad.startDate, pad.completedDate) : (pad.startDate ? daysBetween(pad.startDate, todayStr()) : 0);
      
      allPads.push({
        customer: t.customer || 'Unknown',
        rig: t.rig || 'Unknown',
        name: pad.name || '—',
        totalWells: pad.totalWells || 0,
        billedCount: billed.length,
        status: pad.status || 'active',
        startDate: pad.startDate || '',
        completedDate: pad.completedDate || '',
        days: padDays
      });

      billed.forEach(w=>{
        allWells.push({
          date: w.date || '',
          label: w.label || '',
          customer: t.customer || 'Unknown',
          rig: t.rig || 'Unknown',
          pad: pad.name || '—'
        });
      });

      // Customer stats
      const cust = t.customer || 'Unknown';
      if(!customerStats[cust]) customerStats[cust] = { wells: 0, pads: 0, totalDays: 0, completedPads: 0, activeRigs: new Set() };
      customerStats[cust].wells += billed.length;
      customerStats[cust].pads++;
      if(!t.returnDate) customerStats[cust].activeRigs.add(t.rig);
      if(pad.status === 'complete' && padDays > 0){
        customerStats[cust].totalDays += padDays;
        customerStats[cust].completedPads++;
      }

      // Rig stats
      const rig = t.rig || 'Unknown';
      if(!rigStats[rig]) rigStats[rig] = { wells: 0, pads: 0, totalDays: 0, completedPads: 0, customer: cust };
      rigStats[rig].wells += billed.length;
      rigStats[rig].pads++;
      rigStats[rig].customer = cust;
      if(pad.status === 'complete' && padDays > 0){
        rigStats[rig].totalDays += padDays;
        rigStats[rig].completedPads++;
      }
    });
  });

  // Summary numbers
  const wellsThisMonth = allWells.filter(w=>w.date && w.date.startsWith(thisMonth)).length;
  const wellsThisQuarter = allWells.filter(w=>{
    if(!w.date) return false;
    const d = new Date(w.date + 'T00:00:00');
    return d >= thisQuarterStart && d <= now;
  }).length;
  const wellsAllTime = allWells.length;
  const completedPads = allPads.filter(p=>p.status==='complete');
  const avgDaysOnPad = completedPads.length > 0 ? Math.round(completedPads.reduce((s,p)=>s+p.days,0) / completedPads.length) : '—';
  const activeRigCount = tickets.filter(t=>!t.returnDate).length;

  // Wells billed by month
  const monthMap = {};
  allWells.forEach(w=>{
    if(!w.date) return;
    const m = w.date.substring(0,7);
    monthMap[m] = (monthMap[m]||0) + 1;
  });
  const months = Object.keys(monthMap).sort();
  const monthNames = {
    '01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun',
    '07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec'
  };

  let monthTableRows = '';
  if(months.length > 0){
    months.forEach(m=>{
      const parts = m.split('-');
      const label = monthNames[parts[1]] + ' ' + parts[0];
      const count = monthMap[m];
      const barWidth = Math.min(100, Math.round((count / Math.max(...Object.values(monthMap))) * 100));
      monthTableRows += `<div style="display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #E8EDE8;">
        <div style="width:90px; font-size:13px; color:#5B6660;">${label}</div>
        <div style="flex:1; background:#E8EDE8; border-radius:4px; height:20px; overflow:hidden;">
          <div style="height:100%; width:${barWidth}%; background:#33D63A; border-radius:4px; min-width:2px;"></div>
        </div>
        <div style="width:30px; text-align:right; font-weight:600; font-size:14px;">${count}</div>
      </div>`;
    });
  } else {
    monthTableRows = '<div style="padding:16px 0; color:#5B6660; font-size:13px;">No wells billed yet. Data will appear as you bill wells on the Rig Tracker tab.</div>';
  }

  // Customer breakdown table
  const custEntries = Object.entries(customerStats).sort((a,b)=>b[1].wells - a[1].wells);
  let custTableRows = '';
  custEntries.forEach(([name, stats])=>{
    const avgDays = stats.completedPads > 0 ? Math.round(stats.totalDays / stats.completedPads) : '—';
    custTableRows += `<div style="display:grid; grid-template-columns:1fr 60px 60px 70px 70px; gap:8px; padding:10px 0; border-bottom:1px solid #E8EDE8; font-size:13px; align-items:center;">
      <div style="font-weight:600;">${escHtml(name)}</div>
      <div style="text-align:center;">${stats.activeRigs.size}</div>
      <div style="text-align:center;">${stats.wells}</div>
      <div style="text-align:center;">${stats.pads}</div>
      <div style="text-align:center;">${avgDays}${avgDays!=='—'?' d':''}</div>
    </div>`;
  });

  // Rig efficiency table
  const rigEntries = Object.entries(rigStats).sort((a,b)=>b[1].wells - a[1].wells);
  let rigTableRows = '';
  rigEntries.forEach(([name, stats])=>{
    const avgDays = stats.completedPads > 0 ? Math.round(stats.totalDays / stats.completedPads) : '—';
    rigTableRows += `<div style="display:grid; grid-template-columns:1fr 1fr 60px 60px 70px; gap:8px; padding:10px 0; border-bottom:1px solid #E8EDE8; font-size:13px; align-items:center;">
      <div style="font-weight:600;">${escHtml(name)}</div>
      <div style="color:#5B6660;">${escHtml(stats.customer)}</div>
      <div style="text-align:center;">${stats.wells}</div>
      <div style="text-align:center;">${stats.pads}</div>
      <div style="text-align:center;">${avgDays}${avgDays!=='—'?' d':''}</div>
    </div>`;
  });

  // Pad history (completed pads first, then active)
  const sortedPads = [...allPads].sort((a,b)=>{
    if(a.status==='complete' && b.status!=='complete') return -1;
    if(a.status!=='complete' && b.status==='complete') return 1;
    return (b.completedDate||b.startDate||'').localeCompare(a.completedDate||a.startDate||'');
  });

  let padHistoryRows = '';
  sortedPads.forEach(p=>{
    const isComplete = p.status === 'complete';
    const statusBadge = isComplete 
      ? `<span style="background:#D4EDDA; color:#155724; font-size:11px; padding:2px 8px; border-radius:4px;">Complete</span>`
      : `<span style="background:#FFF3CD; color:#856404; font-size:11px; padding:2px 8px; border-radius:4px;">Active</span>`;
    padHistoryRows += `<div style="display:grid; grid-template-columns:1fr 1fr 1fr 60px 60px 50px; gap:8px; padding:10px 0; border-bottom:1px solid #E8EDE8; font-size:13px; align-items:center;">
      <div style="font-weight:600;">${escHtml(p.customer)}</div>
      <div>${escHtml(p.rig)}</div>
      <div>${escHtml(p.name)}</div>
      <div style="text-align:center;">${p.billedCount}/${p.totalWells}</div>
      <div style="text-align:center;">${p.days > 0 ? p.days + 'd' : '—'}</div>
      <div style="text-align:center;">${statusBadge}</div>
    </div>`;
  });

  return `
    <h2 class="section-title">Reports</h2>

    <div class="summary-cards" style="grid-template-columns:repeat(4,1fr);">
      <div class="summary-card"><div class="num">${wellsThisMonth}</div><div class="lbl">Wells This Month</div></div>
      <div class="summary-card"><div class="num">${wellsThisQuarter}</div><div class="lbl">Wells ${thisQuarterLabel}</div></div>
      <div class="summary-card"><div class="num">${wellsAllTime}</div><div class="lbl">Wells All Time</div></div>
      <div class="summary-card"><div class="num">${avgDaysOnPad}</div><div class="lbl">Avg Days on Pad</div></div>
    </div>

    ${renderRevenueByCustomer()}

    <h2 class="section-title" style="margin-top:24px;">Wells Billed by Month</h2>
    <div style="background:#fff; border:1.5px solid #E8EDE8; border-radius:8px; padding:16px;">
      ${monthTableRows}
    </div>

    <h2 class="section-title" style="margin-top:24px;">Customer Breakdown</h2>
    <div style="background:#fff; border:1.5px solid #E8EDE8; border-radius:8px; padding:16px;">
      <div style="display:grid; grid-template-columns:1fr 60px 60px 70px 70px; gap:8px; padding:0 0 8px 0; border-bottom:2px solid #14181A; font-size:11px; color:#5B6660; text-transform:uppercase; letter-spacing:0.5px;">
        <div>Customer</div>
        <div style="text-align:center;">Rigs</div>
        <div style="text-align:center;">Wells</div>
        <div style="text-align:center;">Pads</div>
        <div style="text-align:center;">Avg Days</div>
      </div>
      ${custTableRows || '<div style="padding:16px 0; color:#5B6660; font-size:13px;">No data yet.</div>'}
    </div>

    <h2 class="section-title" style="margin-top:24px;">Rig Efficiency</h2>
    <div style="background:#fff; border:1.5px solid #E8EDE8; border-radius:8px; padding:16px;">
      <div style="display:grid; grid-template-columns:1fr 1fr 60px 60px 70px; gap:8px; padding:0 0 8px 0; border-bottom:2px solid #14181A; font-size:11px; color:#5B6660; text-transform:uppercase; letter-spacing:0.5px;">
        <div>Rig</div>
        <div>Customer</div>
        <div style="text-align:center;">Wells</div>
        <div style="text-align:center;">Pads</div>
        <div style="text-align:center;">Avg Days</div>
      </div>
      ${rigTableRows || '<div style="padding:16px 0; color:#5B6660; font-size:13px;">No data yet.</div>'}
    </div>

    <h2 class="section-title" style="margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:10px;">
      <span>Pad History</span>
      <button id="toggle-pad-history" style="background:none; border:none; padding:0; color:#2E7D32; font-size:12px; text-transform:none; letter-spacing:0; text-decoration:underline; cursor:pointer; font-family:inherit;">${showPadHistory?'hide':`show ${sortedPads.length} pad${sortedPads.length!==1?'s':''}`}</button>
    </h2>
    ${showPadHistory ? `<div style="background:#fff; border:1.5px solid #E8EDE8; border-radius:8px; padding:16px;">
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr 60px 60px 50px; gap:8px; padding:0 0 8px 0; border-bottom:2px solid #14181A; font-size:11px; color:#5B6660; text-transform:uppercase; letter-spacing:0.5px;">
        <div>Customer</div>
        <div>Rig</div>
        <div>Pad</div>
        <div style="text-align:center;">Wells</div>
        <div style="text-align:center;">Days</div>
        <div style="text-align:center;">Status</div>
      </div>
      ${padHistoryRows || '<div style="padding:16px 0; color:#5B6660; font-size:13px;">No pad data yet.</div>'}
    </div>` : ''}
  `;
}

// Resizes/compresses an uploaded image file down to a reasonable size before
// storing it as base64, since localStorage has limited space per browser.
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Wires up a <canvas> as a drawable signature pad. Restores a previously
// saved signature (if any) so it survives re-renders triggered by other
// form fields changing, and saves a snapshot to draftTicket after each stroke.
function setupSignaturePad(canvasId, fieldName){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1B211C';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const existing = draftTicket[fieldName];
  if(existing){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = existing;
  }

  let drawing = false;

  function getPos(ev){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (ev.clientX - rect.left) * scaleX, y: (ev.clientY - rect.top) * scaleY };
  }

  canvas.onpointerdown = (ev)=>{
    drawing = true;
    const p = getPos(ev);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(ev.pointerId);
  };
  canvas.onpointermove = (ev)=>{
    if(!drawing) return;
    const p = getPos(ev);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  const endStroke = ()=>{
    if(!drawing) return;
    drawing = false;
    draftTicket[fieldName] = canvas.toDataURL('image/png');
  };
  canvas.onpointerup = endStroke;
  canvas.onpointerleave = endStroke;
  canvas.onpointercancel = endStroke;
}

function renderPadSection(t){
  const hasPads = Array.isArray(t.pads) && t.pads.length > 0;
  if(!hasPads) return '';

  const activePad = getActivePad(t);
  const completedPads = t.pads.filter(p=>p.status === 'complete');

  let html = '<div style="font-family:\'IBM Plex Mono\',monospace; font-size:11px; margin-bottom:8px; padding:6px 0; border-top:1px solid var(--line);">';
  html += '<span style="text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft);">Pad: </span>';

  if(activePad){
    const billed = Array.isArray(activePad.billedWells) ? activePad.billedWells.length : 0;
    const total = activePad.totalWells || 0;
    const complete = billed >= total && total > 0;
    html += `<span style="color:${complete?'var(--green)':'var(--ink)'};">${escHtml(activePad.name)} — ${billed}/${total} billed${complete?' ✓':''}</span>`;
  }

  if(completedPads.length > 0){
    html += `<details style="margin-top:6px;" class="equip-collapse">`;
    html += `<summary style="cursor:pointer; font-size:11px; color:var(--ink-soft); list-style:none; display:flex; align-items:center; gap:6px; padding:2px 0;">`;
    html += `<span style="font-size:14px; transition:transform 0.2s;">▸</span> ${completedPads.length} previous pad${completedPads.length!==1?'s':''}`;
    html += `</summary>`;
    html += `<div style="padding:4px 0 2px 0;">`;
    completedPads.forEach(p=>{
      const b = Array.isArray(p.billedWells) ? p.billedWells.length : 0;
      html += `<div style="font-size:11px; color:var(--ink-soft); padding:3px 0;">${escHtml(p.name)} — ${b}/${p.totalWells} wells — ${fmtDate(p.startDate)} to ${fmtDate(p.completedDate||'')}</div>`;
    });
    html += `</div></details>`;
  }

  html += '</div>';
  return html;
}

// Shows a visible warning banner when a localStorage write fails — this
// prevents the silent data loss scenario where the app looks like it saved
// but nothing actually persisted. The banner stays until dismissed.
function showStorageWarning(context, err){
  console.error('Storage write failed (' + context + '):', err);
  if(document.getElementById('storage-warning-banner')) return; // already showing
  var banner = document.createElement('div');
  banner.id = 'storage-warning-banner';
  banner.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#B5432A; color:#fff; padding:12px 20px; z-index:99999; font-family:Inter,sans-serif; font-size:14px; display:flex; justify-content:space-between; align-items:center;';
  banner.innerHTML = '<span><strong>⚠ Save failed</strong> — your data may not have been saved. Your browser storage may be full or blocked. Back up your data now.</span><button onclick="this.parentElement.remove()" style="background:none; border:1px solid #fff; color:#fff; padding:4px 12px; border-radius:4px; cursor:pointer; margin-left:12px; font-size:12px;">Dismiss</button>';
  document.body.prepend(banner);
}

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return escHtml(s); }

        const count = parsed.tickets.length;

        const msg = willReplace
          ? `This will REPLACE your current ${tickets.length} ticket(s) with the ${count} ticket(s) from this backup file. This cannot be undone. Continue?`
          : `Import ${count} ticket(s) from this backup file?`;
        if(!confirm(msg)) return;

        // Pause the background auto-sync while importing - otherwise a
        // periodic pull landing mid-import can fetch the still-current
        // (pre-import) cloud data and stomp the import a moment later.
        if(autoSyncTimer){ clearInterval(autoSyncTimer); autoSyncTimer = null; }

        tickets = parsed.tickets;
        if(Array.isArray(parsed.catalog) && parsed.catalog.length){
          equipmentCatalog = parsed.catalog;
        }
        if(parsed.equipmentOwned && typeof parsed.equipmentOwned === 'object'){
          equipmentOwned = parsed.equipmentOwned;
        }
        if(Array.isArray(parsed.colorCatalog) && parsed.colorCatalog.length){

        // requests and widens the window for the race described above.
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets)); }catch(e){ showStorageWarning('tickets', e); }
        try{ localStorage.setItem(CATALOG_KEY, JSON.stringify(equipmentCatalog)); }catch(e){ showStorageWarning('catalog', e); }

        if(syncUrl) await pushToCloud();

          notes: t.notes||'',
          photo: t.photo||'',
          signatureDelivered: t.signatureDelivered||'',
          signatureReceived: t.signatureReceived||''
        };
        currentTab = 'new';
        render();
      };
    });
    document.querySelectorAll('[data-return]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.return);
        if(t){ t.returnDate = todayStr(); t.updatedAt = nowIso(); await saveTickets(); render(); }
      };
    });
    document.querySelectorAll('[data-delete]').forEach(b=>{
      b.onclick = async ()=>{
        if(!confirm('Delete this ticket? This cannot be undone.')) return;
        // Record the deletion for the backend BEFORE dropping it locally, so
        // the next push tells the server to remove it from the shared set and
        // remember it - otherwise a merge would just add it back from another
        // device's copy.
        if(!pendingDeletes.includes(b.dataset.delete)) pendingDeletes.push(b.dataset.delete);
        tickets = tickets.filter(x=>x.id!==b.dataset.delete);
        await saveTickets();
        render();
      };
    });

    // ── END PAD TRACKING ACTION HANDLERS ──────────────────────────────
  }

  // ── PAD TRACKING ACTION HANDLERS (shared across tickets + rig tracker) ──
  document.querySelectorAll('[data-well-billed]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.wellBilled);
        if(!t) return;
        const pad = getActivePad(t);
        if(!pad) return;
        // A blank name used to be accepted, which quietly recorded a well with
        // a date and nothing else - easy to do by tapping through, and the
        // only way to undo it was hand-editing JSON in the Google Sheet.
        // Now an empty box re-asks instead of counting. Cancel still bails.
        const label = promptRequired('Well name or number:', 'A well name or number is required.');
        if(label === null) return;
        if(!Array.isArray(pad.billedWells)) pad.billedWells = [];
        pad.billedWells.push({ date: todayStr(), label: label });
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-unbill-well]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.unbillWell);
        if(!t) return;
        const pad = getActivePad(t);
        if(!pad || !Array.isArray(pad.billedWells)) return;
        const i = parseInt(b.dataset.wellIndex, 10);
        const w = pad.billedWells[i];
        if(!w) return;
        const desc = w.label ? `"${w.label}"` : `the entry dated ${fmtDate(w.date)}`;
        if(!confirm(`Remove ${desc} from ${pad.name}?\n\nThis lowers the billed count for this pad.`)) return;
        pad.billedWells.splice(i, 1);
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-rig-move]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.rigMove);
        if(!t) return;
        const pad = getActivePad(t);
        if(pad){
          const billed = Array.isArray(pad.billedWells) ? pad.billedWells.length : 0;
          if(billed < (pad.totalWells||0)){
            if(!confirm(`${pad.name} has ${billed} of ${pad.totalWells} wells billed. Move anyway? Unbilled wells may get missed.`)) return;
          }
        }
        // Ask what's happening — new pad or coming home?
        const goingToNewPad = confirm('Is the iron going to a new pad?\n\nOK = Yes, moving to a new pad\nCancel = No');
        if(goingToNewPad){
          const newName = promptRequired('New pad name:', 'A pad name is required.');
          if(newName === null) return; // cancelled — nothing happens
          const newWells = promptWellCount();
          if(newWells === null) return; // cancelled — nothing happens
          // Mark current pad complete now that we know they're committed
          if(pad){ pad.status = 'complete'; pad.completedDate = todayStr(); }
          if(!Array.isArray(t.pads)) t.pads = [];
          t.pads.push({
            id: 'p_' + Math.random().toString(36).slice(2,8),
            name: newName,
            totalWells: newWells,
            billedWells: [],
            status: 'active',
            startDate: todayStr()
          });
        } else {
          // They said it's NOT going to a new pad — confirm they want to mark returned
          const comingHome = confirm('Mark this equipment as returned?');
          if(!comingHome) return; // cancelled — nothing happens
          if(pad){ pad.status = 'complete'; pad.completedDate = todayStr(); }
          t.returnDate = todayStr();
        }
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-add-pad]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.addPad);
        if(!t) return;
        const name = promptRequired('Pad name:', 'A pad name is required.');
        if(name === null) return;
        const wells = promptWellCount();
        if(wells === null) return;
        if(!Array.isArray(t.pads)) t.pads = [];
        t.pads.push({
          id: 'p_' + Math.random().toString(36).slice(2,8),
          name: name,
          totalWells: wells,
          billedWells: [],
          status: 'active',
          startDate: todayStr()
        });
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });

    document.querySelectorAll('[data-set-well-count]').forEach(b=>{
      b.onclick = async ()=>{
        const t = tickets.find(x=>x.id===b.dataset.setWellCount);
        if(!t) return;
        const pad = getActivePad(t);
        if(!pad) return;
        const wells = parseInt(prompt(`How many wells on ${pad.name}?`));
        if(!wells || wells < 1) return;
        pad.totalWells = wells;
        t.updatedAt = nowIso();
        await saveTickets();
        render();
      };
    });
    // ── END PAD TRACKING ACTION HANDLERS ──────────────────────────────

  if(currentTab === 'byrig'){
    const rigSearch = document.getElementById('rig-search-input');
    if(rigSearch){
      rigSearch.oninput = ()=>{
        rigSearchTerm = rigSearch.value;
        render();
        const el = document.getElementById('rig-search-input');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
    }
    document.querySelectorAll('[data-select-ticket]').forEach(cb=>{
      cb.onchange = ()=>{
        const id = cb.dataset.selectTicket;
        if(cb.checked) selectedTicketIds.add(id);
        else selectedTicketIds.delete(id);
        render();
      };
    });
    const bulkReturnBtn = document.getElementById('bulk-return-btn');
    if(bulkReturnBtn) bulkReturnBtn.onclick = async ()=>{
      const count = selectedTicketIds.size;
      if(count === 0) return;
      if(!confirm(`Mark ${count} ticket${count!==1?'s':''} as returned today?`)) return;
      const today = todayStr();
      tickets.forEach(t=>{
        if(selectedTicketIds.has(t.id)) t.returnDate = today;
      });
      selectedTicketIds.clear();
      await saveTickets();
      render();
    };
  }

  const countSheetBtn = document.getElementById('print-count-sheet-btn');
  if(countSheetBtn) countSheetBtn.onclick = ()=> printCountSheet();

  if(currentTab === 'inventory'){
    const invSearch = document.getElementById('inventory-search-input');
    if(invSearch){
      invSearch.oninput = ()=>{
        inventorySearchTerm = invSearch.value;
        render();
        const el = document.getElementById('inventory-search-input');
        if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
    }
  }
}

async function onSaveTicket(){
  const ticketNumber = (draftTicket.ticketNumber||'').trim();
  const customer = (draftTicket.customer||'').trim();
  const rig = (draftTicket.rig||'').trim();
  const deliveryDate = draftTicket.deliveryDate || todayStr();
  const returnDate = draftTicket.returnDate || null;
  const notes = (draftTicket.notes||'').trim();
  const photo = draftTicket.photo || '';
  const signatureDelivered = draftTicket.signatureDelivered || '';
  const signatureReceived = draftTicket.signatureReceived || '';

  const wellCharges = draftWellCharges
    .filter(w=>w.date || w.amount)
    .map(w=>({ id: w.id, date: w.date || deliveryDate, label: (w.label||'').trim(), amount: Number(w.amount)||0 }));

  const equipment = draftEquip
    .map(e=>({name:e.name.trim(), serial:(e.serial||'').trim(), bandColor:(e.bandColor||'').trim(), qty:Number(e.qty)||0}))
    .filter(e=>e.name);

  if(!ticketNumber){ alert('Please enter a ticket number.'); return; }
  if(equipment.length===0){ alert('Please add at least one piece of equipment.'); return; }

  const duplicate = tickets.find(t=>
    t.id !== editingId &&
    (t.ticketNumber||'').trim().toLowerCase() === ticketNumber.toLowerCase()
  );
  if(duplicate){
    const proceed = confirm(`Ticket number "${ticketNumber}" is already used on another ticket (${duplicate.customer||'—'} / ${duplicate.rig||'—'}). Save anyway?`);
    if(!proceed) return;
  }

  let savedTicketId;
  if(editingId){
    savedTicketId = editingId;
    const idx = tickets.findIndex(t=>t.id===editingId);
    if(idx>-1){
      tickets[idx] = {...tickets[idx], ticketNumber, customer, rig, deliveryDate, returnDate, notes, photo, signatureDelivered, signatureReceived, wellCharges, equipment, updatedAt: nowIso()};
    }
    editingId = null;
  }else{
    savedTicketId = uid();
    // Build the initial pad entry if the user filled in pad info.
    const padName = (draftTicket.initialPadName||'').trim();
    const padWells = parseInt(draftTicket.initialPadWells)||0;
    const initialPads = (padName && padWells > 0) ? [{
      id: 'p_' + Math.random().toString(36).slice(2,8),
      name: padName,
      totalWells: padWells,
      billedWells: [],
      status: 'active',
      startDate: deliveryDate
    }] : [];
    tickets.push({id:savedTicketId, ticketNumber, customer, rig, deliveryDate, returnDate, notes, photo, signatureDelivered, signatureReceived, wellCharges, equipment, pads: initialPads, updatedAt: nowIso()});
  }

  addToCatalogIfNew(rigCatalog, rig);
  addToCatalogIfNew(customerCatalog, customer);

  // Save catalogs to local storage directly (pushToCloud already bundles
  // rig/customer data into the same request that saveTickets() below
  // triggers, so there's no need for three separate overlapping pushes).
  try{ localStorage.setItem(RIG_CATALOG_KEY, JSON.stringify(rigCatalog)); }catch(e){ console.error('Could not save rig list', e); }
  try{ localStorage.setItem(CUSTOMER_CATALOG_KEY, JSON.stringify(customerCatalog)); }catch(e){ console.error('Could not save customer list', e); }

  // Kick off saving (local write happens synchronously inside this, before
  // any network call) but don't wait on the cloud push before moving on -
  // otherwise a slow sync can finish later and force the tab back to
  // "tickets" even if the user has already navigated elsewhere by then.
  saveTickets();
  // Also keep the separate Signatures sheet (used by delivery-signing
  // links) in sync, so clearing/changing a signature here actually sticks
  // instead of a stale driver-submitted one reappearing on the next pull.
  pushSignatureUpdate(savedTicketId, signatureDelivered, signatureReceived);

  // Back up any photos or signatures captured in the main app to Google
  // Drive. Runs fully async in the background - the user is already back
  // on the tickets list by the time this starts uploading.
  if(photo || signatureDelivered || signatureReceived){
    backupTicketMedia(savedTicketId);
  }

  resetDraftEquip();
  resetDraftTicket();
  currentTab = 'tickets';
  render();
}

// Shows a simple full-screen password prompt and resolves true once the
// correct password is entered (and remembered for next time on this
// device), or never resolves if the tab is just closed instead.
// After 15 minutes with no interaction anywhere on the page (typing,
// clicking, tapping, scrolling), re-locks the app and shows the password
// gate again - without losing any in-memory state, so once unlocked again
// everything is exactly where it was.
let lastActivityTime = Date.now();
let inactivityLockActive = false;
const INACTIVITY_LOCK_MS = 15 * 60 * 1000;

function startInactivityAutoLock(){
  const markActivity = ()=>{ lastActivityTime = Date.now(); };
  ['keydown','mousedown','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, markActivity, { passive: true });
  });
  setInterval(async ()=>{
    if(inactivityLockActive) return;
    if(Date.now() - lastActivityTime >= INACTIVITY_LOCK_MS){
      inactivityLockActive = true;
      localStorage.removeItem('flowtech_equipment_tracker_unlocked');
      const unlocked = await showPasswordGate(APP_PASSWORD);
      if(unlocked){
        markActivity();
        inactivityLockActive = false;
        render();
      }
    }
  }, 30000); // check every 30 seconds - frequent enough without being wasteful
}

function showPasswordGate(correctPassword){
  return new Promise((resolve)=>{
    app.innerHTML = `
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--charcoal); padding:20px;">
        <div style="max-width:320px; width:100%; text-align:center;">
          <div class="password-gate-logo" style="margin-bottom:14px;">${LOGO_SVG_MARKUP}</div>
          <div style="font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; color:var(--amber); font-size:18px; margin-bottom:4px;">Flow-Tech Systems</div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#9FB3A5; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:20px;">Equipment Tracker</div>
          <input type="password" id="app-password-input" placeholder="Password" style="width:100%; padding:12px 14px; border-radius:6px; border:1.5px solid #3A4640; background:#1D2426; color:#F4F7F4; font-size:14px; text-align:center; margin-bottom:12px;">
          <button id="app-password-submit" style="width:100%; background:var(--amber); color:#14181A; border:none; padding:12px; border-radius:6px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:13px; cursor:pointer; font-weight:600;">Unlock</button>
          <div id="app-password-error" style="color:#E08080; font-size:12px; margin-top:10px; min-height:16px;"></div>
        </div>
      </div>
    `;
    const input = document.getElementById('app-password-input');
    const errorEl = document.getElementById('app-password-error');
    const attempt = ()=>{
      if(input.value === correctPassword){
        localStorage.setItem('flowtech_equipment_tracker_unlocked', 'yes');
        resolve(true);
      }else{
        errorEl.textContent = 'Incorrect password.';
        input.value = '';
        input.focus();
      }
    };
    document.getElementById('app-password-submit').onclick = attempt;
    input.onkeydown = (ev)=>{ if(ev.key === 'Enter') attempt(); };
    input.focus();
  });
}

async function init(){
  // If this device has anything left over from a previous failed
  // submission (driver closed the tab before it could retry), give it
  // one more attempt now, silently, before doing anything else.
  flushPendingSubmissions();

  // Check for a delivery-confirmation link (?sign=TICKET_ID&api=WEBAPP_URL)
  // before booting the normal app. This is a deliberately isolated mode: it
  // only ever sees ONE ticket, can't navigate anywhere else, and can't see
  // or touch equipment lists, other tickets, or app settings. Meant for
  // handing to a driver/delivery person who shouldn't have full app access.
  const params = new URLSearchParams(window.location.search);
  const signTicketId = params.get('sign');
  const signApiUrl = params.get('api') || DEFAULT_SYNC_URL;
  if(signTicketId && signApiUrl){
    await runSignatureCaptureMode(signTicketId, signApiUrl);
    return;
  }
  const returnTicketId = params.get('return');
  const returnApiUrl = params.get('api') || DEFAULT_SYNC_URL;
  if(returnTicketId && returnApiUrl){
    await runReturnCaptureMode(returnTicketId, returnApiUrl);
    return;
  }

  // Simple shared-password gate for the main app - not true security (this
  // check lives in the browser and could be bypassed by someone who knows
  // how to view page source), but a real deterrent against the link
  // accidentally ending up somewhere public. Stored in localStorage once
  // entered correctly, so it's only asked for once per device.
  if(localStorage.getItem('flowtech_equipment_tracker_unlocked') !== 'yes'){
    const unlocked = await showPasswordGate(APP_PASSWORD);
    if(!unlocked) return;
  }
  startInactivityAutoLock();

  resetDraftEquip();
  resetDraftTicket();
  await loadTickets();
  await loadCatalog();
  await loadEquipmentOwned();
  await loadAppSettings();
  await loadColorCatalog();
  await loadRigCatalog();
  await loadArchivedRigs();
  await loadCustomerCatalog();
  await loadTemplates();
  loadSyncUrl();
  render();
  if(syncUrl){
    await pullFromCloud(true);
    startAutoSync();
    if(currentTab === 'dashboard') fetchQuickBooksAR();
    if(currentTab === 'reports') fetchQuickBooksRevenue();
  }
}

    // the full dataset, so a driver or customer with a signing link can't
    // see other tickets, rates, or customer info.
    const res = await fetch(`${apiUrl}${apiUrl.includes('?')?'&':'?'}action=ticket&id=${encodeURIComponent(ticketId)}`, { method: 'GET' });
    const data = await res.json();

        <div style="margin-bottom:20px;">
          <div style="font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#5B6660; margin-bottom:6px;">Photo of Delivered Equipment <span style="font-family:'Inter',sans-serif; text-transform:none; letter-spacing:0; font-size:11px;">(optional)</span></div>
          <p style="font-size:12px; color:#5B6660; margin:0 0 10px 0;">On a phone, this opens your camera directly.</p>
          <input type="file" accept="image/*" capture="environment" id="sign-mode-photo-input" style="display:none;">
          <div id="sign-mode-photo-preview" style="margin-bottom:10px;"></div>
          <button style="background:none; border:1.5px solid #5B6660; color:#5B6660; padding:8px 16px; border-radius:6px; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-size:12px; cursor:pointer;" id="sign-mode-photo-btn">Take / Choose Photo</button>
        </div>

        <!-- Signatures -->
        <div style="margin-bottom:20px;">
          <div style="font-family:'Oswald',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#5B6660; margin-bottom:8px;">Delivered By</div>
          <canvas id="sign-mode-delivered" width="320" height="120" style="width:100%; max-width:400px; border:1.5px solid #D3DED4; border-radius:6px; background:#FAFCF9; touch-action:none;"></canvas>

          <canvas id="sign-mode-received" width="320" height="120" style="width:100%; max-width:400px; border:1.5px solid #D3DED4; border-radius:6px; background:#FAFCF9; touch-action:none;"></canvas>

        <div style="text-align:center; margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8A8F94;">Flow-Tech Systems LLC · Equipment Tracker</div>
      </div>
    </div>
  `;

  let deliveredData = ticket.signatureDelivered || '';
  let receivedData = ticket.signatureReceived || '';
  let deliveryPhotoData = '';

  document.getElementById('sign-mode-photo-btn').onclick = ()=>{
    document.getElementById('sign-mode-photo-input').click();
  };
  document.getElementById('sign-mode-photo-input').onchange = async ()=>{
    const file = document.getElementById('sign-mode-photo-input').files[0];
    if(!file) return;
    try{
      deliveryPhotoData = await resizeImageFile(file, 1000, 0.65);
      document.getElementById('sign-mode-photo-preview').innerHTML =
        `<img src="${deliveryPhotoData}" style="max-width:100%; max-height:200px; border-radius:6px; border:1.5px solid var(--line);">`;
    }catch(err){
      console.error('Photo processing failed', err);
      alert('Could not process that photo. Try a different image.');
    }
  };

  function setupPad(canvasId, onUpdate, existing){
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#1B211C';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(existing){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = existing;
    }
    let drawing = false;
    function getPos(ev){
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (ev.clientX - rect.left) * scaleX, y: (ev.clientY - rect.top) * scaleY };
    }
    canvas.onpointerdown = (ev)=>{ drawing = true; const p = getPos(ev); ctx.beginPath(); ctx.moveTo(p.x,p.y); canvas.setPointerCapture(ev.pointerId); };
    canvas.onpointermove = (ev)=>{ if(!drawing) return; const p = getPos(ev); ctx.lineTo(p.x,p.y); ctx.stroke(); };
    const end = ()=>{ if(!drawing) return; drawing = false; onUpdate(canvas.toDataURL('image/png')); };
    canvas.onpointerup = end;
    canvas.onpointerleave = end;
    canvas.onpointercancel = end;
    return canvas;
  }

  setupPad('sign-mode-delivered', (d)=>{ deliveredData = d; }, deliveredData);
  setupPad('sign-mode-received', (d)=>{ receivedData = d; }, receivedData);

  document.getElementById('sign-mode-clear-delivered').onclick = ()=>{
    deliveredData = '';
    document.getElementById('sign-mode-delivered').getContext('2d').clearRect(0,0,320,120);
  };
  document.getElementById('sign-mode-clear-received').onclick = ()=>{
    receivedData = '';
    document.getElementById('sign-mode-received').getContext('2d').clearRect(0,0,320,120);
  };

    const statusEl = document.getElementById('sign-mode-status');
    const submitBtn = document.getElementById('sign-mode-submit');
    if(!deliveredData && !receivedData){
      statusEl.textContent = 'Please sign at least one field before submitting.';
      return;
    }
    submitBtn.disabled = true;
    statusEl.textContent = 'Submitting...';
    const requestBody = { signatureUpdate: { ticketId, signatureDelivered: deliveredData, signatureReceived: receivedData, deliveryPhoto: deliveryPhotoData, source: 'driver' } };
    try{
      // Only send this one ticket's signature data, to a small dedicated
      // row - never touches or resends the full ticket list, so there's
      // no risk of clobbering other changes or hitting any size limit.
      await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(requestBody)
      });
      app.innerHTML = `
        <div style="max-width:480px; margin:60px auto; text-align:center; font-family:'Inter',sans-serif; padding:24px;">
          <div style="background:#14181A; padding:14px 20px; border-radius:8px 8px 0 0; border-bottom:4px solid #33D63A;">
            <div style="color:#F4F7F4; font-family:'Oswald',sans-serif; font-size:16px; letter-spacing:1px;">FLOW-TECH SYSTEMS LLC</div>
          </div>
          <div style="background:#FAFCF9; border:1px solid #E8EDE8; border-radius:0 0 8px 8px; padding:24px;">
            <h2 style="font-family:'Oswald',sans-serif; text-transform:uppercase; color:#1E8A29; margin-top:0;">Signature Submitted</h2>
            <p style="color:#5B6660;">Thank you — ticket #${escHtml(ticket.ticketNumber||'')} has been confirmed. You may close this page.</p>
          </div>
        </div>
      `;
    }catch(e){
      // No connection right now - rig sites often have weak signal. Save
      // this on the device and keep retrying automatically instead of
      // losing it if the driver just closes the tab.
      queuePendingSubmission(apiUrl, requestBody);
      app.innerHTML = `
        <div style="max-width:480px; margin:60px auto; text-align:center; font-family:'Inter',sans-serif; padding:24px;">
          <h2 style="font-family:'Oswald',sans-serif; text-transform:uppercase; color:var(--amber);">Saved - Will Send Automatically</h2>
          <p style="color:var(--ink-soft);">No connection right now, but your signature for ticket #${escHtml(ticket.ticketNumber||'')} has been saved on this device. It'll send automatically as soon as you're back online - you can close this page or leave it open.</p>
          <p id="retry-status" style="color:var(--ink-soft); font-size:13px; margin-top:16px;"></p>
        </div>
      `;
      startPendingSubmissionRetry((result)=>{
        const retryStatusEl = document.getElementById('retry-status');
        if(retryStatusEl && result.succeeded > 0){
          retryStatusEl.textContent = 'Sent successfully - thank you!';
          retryStatusEl.style.color = '#1E8A29';
        }
      });
    }
  };
}

}
