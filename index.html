<style>
  :root{
    --charcoal:#14181A;
    --charcoal-2:#1D2426;
    --amber:#33D63A;
    --amber-dim:#1E8A29;
    --paper:#F4F7F4;
    --paper-2:#E8EDE8;
    --ink:#1B211C;
    --ink-soft:#5B6660;
    --steel:#5C6670;
    --rust:#B5432A;
    --danger:#8B1F1F;
    --green:#1E8A29;
    --line:#D3DED4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--charcoal);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  @font-face{}
  .app{
    max-width:960px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--charcoal);
    color:var(--paper);
    padding:20px 24px 0 24px;
    border-bottom:4px solid var(--amber);
    box-shadow:0 6px 14px -6px rgba(20,24,26,0.35);
    position:relative;
    z-index:1;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:14px;
  }
  .brand-row svg.logo-symbol{
    height:64px;
    width:auto;
    display:block;
  }
  .password-gate-logo svg.logo-symbol{
    height:64px;
    width:auto;
    display:block;
    margin:0 auto;
  }
  .brand-row svg.logo-name{
    height:34px;
    width:auto;
    display:block;
  }
  header h1{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:22px;
    margin:0;
    font-weight:600;
    line-height:1.15;
  }
  header .sub{
    font-size:11px;
    color:#9FB3A5;
    letter-spacing:1.5px;
    margin-top:2px;
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
  }
  nav{
    display:flex;
    gap:2px;
  }
  nav button{
    background:var(--charcoal-2);
    color:#C7CDD0;
    border:none;
    padding:11px 18px;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:13px;
    cursor:pointer;
    border-radius:6px 6px 0 0;
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .nav-icon{
    width:15px;
    height:15px;
    flex-shrink:0;
  }
  nav button.active{
    background:var(--paper);
    color:var(--ink);
  }
  nav button#toggle-sync-panel{
    background:none;
    color:#9FB3A5;
    border:1px solid #3A4640;
    font-size:11px;
    letter-spacing:0.5px;
    padding:8px 12px;
  }
  .sync-panel{
    background:#EFF5F0;
    border-bottom:1.5px solid var(--line);
    padding:18px 24px;
  }
  main{
    flex:1;
    padding:24px;
  }
  h2.section-title{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-size:18px;
    color:var(--ink);
    margin:0 0 16px 0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h2.section-title::after{
    content:"";
    flex:1;
    height:2px;
    background:var(--line);
  }
  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field.full{grid-column:1/-1;}
  label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
  }
  input,textarea,select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  input:focus,textarea:focus,select:focus{
    outline:2px solid var(--amber);
    outline-offset:1px;
    border-color:var(--amber);
  }
  .equip-list{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:14px;
    margin-bottom:14px;
    background:#FCFAF3;
  }
  table.equip-table-input{
    width:100%;
    border-collapse:collapse;
    margin-bottom:10px;
  }
  table.equip-table-input th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    padding:4px 8px 8px 8px;
  }
  table.equip-table-input td{
    padding:5px 8px;
    vertical-align:top;
  }
  table.equip-table-input select,
  table.equip-table-input input{
    width:100%;
  }
  .equip-remove{
    background:none;
    border:none;
    color:var(--rust);
    font-size:18px;
    cursor:pointer;
    line-height:1;
  }
  .add-equip-btn{
    background:none;
    border:1.5px dashed var(--steel);
    color:var(--steel);
    padding:7px 12px;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .manage-catalog{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:14px;
    margin-bottom:12px;
    background:#FFFDF8;
  }
  .catalog-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 4px;
    border-bottom:1px solid var(--paper-2);
    font-size:13px;
  }
  .catalog-item:last-of-type{border-bottom:none;}
  .catalog-remove{
    background:none;
    border:none;
    color:var(--rust);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  .primary-btn{
    background:var(--amber);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:6px;
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:14px;
    cursor:pointer;
  }
  .primary-btn:hover{background:var(--amber-dim);}
  .ghost-btn{
    background:none;
    border:1.5px solid var(--steel);
    color:var(--steel);
    padding:9px 18px;

function uid(){ return 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function eqid(){ return 'e_' + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
// Full timestamp (not just the date) used to stamp every ticket change, so
// the shared backend can merge two devices' edits by keeping the newer one
// instead of letting whoever saves last overwrite the other's tickets.
function nowIso(){ return new Date().toISOString(); }
// Ids of tickets deleted on THIS device that still need to be reported to

let pendingDeletes = [];

// ── PAD / WELL BILLING HELPERS ──────────────────────────────────────
// Each ticket can carry a history of pads the iron has visited. The
// active pad is where the equipment is right now; completed pads are
// history. Each pad tracks total wells vs how many have been billed.
function getActivePad(t){
  if(!Array.isArray(t.pads)) return null;
  for(let i = t.pads.length - 1; i >= 0; i--){
    if(t.pads[i].status === 'active') return t.pads[i];
  }
  return null;
}
function padSummaryText(pad){
  if(!pad) return '';
  const billed = Array.isArray(pad.billedWells) ? pad.billedWells.length : 0;
  return `${billed} of ${pad.totalWells} wells billed`;
}
function daysSinceLastBilled(pad){
  if(!pad || !Array.isArray(pad.billedWells) || pad.billedWells.length === 0) return null;
  const sorted = pad.billedWells.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return daysBetween(sorted[0].date, todayStr());
}
function isPadComplete(pad){
  if(!pad) return false;
  const billed = Array.isArray(pad.billedWells) ? pad.billedWells.length : 0;
  return billed >= (pad.totalWells || 0) && pad.totalWells > 0;
}

// connection comes back - either via the browser's 'online' event or a
// periodic check while the page stays open.
const PENDING_SUBMISSIONS_KEY = 'flowtech_pending_submissions';

function getPendingSubmissions(){
  try{
    const raw = localStorage.getItem(PENDING_SUBMISSIONS_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}

function savePendingSubmissions(list){
  try{
    localStorage.setItem(PENDING_SUBMISSIONS_KEY, JSON.stringify(list));
  }catch(e){
    console.error('Could not save pending submission', e);
  }
}

function queuePendingSubmission(apiUrl, body){
  const list = getPendingSubmissions();
  list.push({ id: eqid(), apiUrl, body, queuedAt: new Date().toISOString() });
  savePendingSubmissions(list);
}

// Tries to send every queued submission. Successes are removed from the
// queue; anything that still fails (still offline) stays queued for next
// time. Safe to call repeatedly - does nothing if the queue is empty.
async function flushPendingSubmissions(){
  const list = getPendingSubmissions();
  if(list.length === 0) return { attempted: 0, succeeded: 0 };
  const stillPending = [];
  let succeeded = 0;
  for(const item of list){
    try{
      await fetch(item.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(item.body)
      });
      succeeded++;
    }catch(e){
      stillPending.push(item);
    }
  }
  savePendingSubmissions(stillPending);
  return { attempted: list.length, succeeded };
}

// Starts listening for connectivity coming back, and retries in the
// background. Calls onFlush(result) each time an attempt runs, whether or
// not anything actually succeeded, so the UI can react if it wants to.
function startPendingSubmissionRetry(onFlush){
  const tryFlush = async ()=>{
    const result = await flushPendingSubmissions();
    if(onFlush) onFlush(result);
  };
  window.addEventListener('online', tryFlush);
  setInterval(tryFlush, 15000); // also poll periodically - the 'online' event isn't always reliable on flaky rig-site connections
}

function daysBetween(a,b){
  const d1 = new Date(a), d2 = new Date(b);
  return Math.max(1, Math.round((d2-d1)/(1000*60*60*24)));
}
function fmtMoney(n){ return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

// Invoicing is tracked per well charge (since one ticket can have some
// wells billed and others not yet) - legacy tickets without wellCharges
function ticketTotal(t){
  // New model: a ticket can carry multiple dated well charges, accumulated
  // as the equipment moves pad to pad on the same rig before it's returned.
  if(Array.isArray(t.wellCharges) && t.wellCharges.length > 0){
    return t.wellCharges.reduce((sum,w)=> sum + (Number(w.amount)||0), 0);
  }

  // Falls back to the older single-charge-per-ticket model for tickets
  // saved before well charges existed.
  const extra = Number(t.extraChargeAmount) || 0;
  if(t.billingType === 'perday' && t.dayRate){
    const end = t.returnDate || todayStr();
    const days = Math.max(1, daysBetween(t.deliveryDate, end));
    return (Number(t.dayRate)||0) * days + extra;
  }
  if(t.totalCost !== undefined && t.totalCost !== null && t.totalCost !== ''){
    return (Number(t.totalCost) || 0) + extra;
  }
  return t.equipment.reduce((sum,e)=> sum + (Number(e.price)||0), 0) + extra;
}

function isTicketOverdue(t){

  const days = daysBetween(t.deliveryDate, todayStr());
  return days > (appSettings.overdueThresholdDays || 30);

// Adds a value to a catalog array (deduped, case-insensitive) if not already present.
function addToCatalogIfNew(catalogArr, value){
  const v = (value||'').trim();
  if(!v) return catalogArr;
  const exists = catalogArr.some(x=>x.toLowerCase()===v.toLowerCase());
  if(!exists) catalogArr.push(v);
  return catalogArr;
}

// local data with it (cloud is treated as the source of truth once connected).

    qbArData = await res.json();

async function pullFromCloud(silent){
  if(!syncUrl) return;
  // Never pull while a push is still in flight — the server may not have
  // the latest data yet, and pulling now would overwrite local changes
  // with stale cloud data (the "well billed then disappears" bug).
  if(pushInProgress) return;
  if(!silent) syncStatus = 'loading';
  render();
  try{
    const res = await fetch(syncUrl, { method: 'GET' });
    if(!res.ok) throw new Error('Bad response');
    const data = await res.json();
    if(Array.isArray(data.tickets)){
      // Photos and hand-drawn signatures made ON THIS DEVICE are never sent
      // to the cloud as part of the main ticket blob (see pushToCloud) -
      // preserve them when merging in the cloud's ticket data.
      const localMedia = {};
      tickets.forEach(t=>{
        if(t.photo || t.signatureDelivered || t.signatureReceived){
          localMedia[t.id] = { photo: t.photo, signatureDelivered: t.signatureDelivered, signatureReceived: t.signatureReceived };
        }
      });
      tickets = data.tickets.map(t=>{
        // Signatures submitted remotely via a delivery-confirmation link
        // live in the separate small "signatures" lookup below - apply
        // those first, then let a signature already captured on THIS
        // device take priority if there is one.
        const remoteSig = data.signatures && data.signatures[t.id];
        const remoteReturn = data.returns && data.returns[t.id];
        let merged = remoteSig ? {...t, ...remoteSig} : t;
        if(remoteReturn) merged = {...merged, returnConfirmation: remoteReturn};
        return localMedia[t.id] ? {...merged, ...localMedia[t.id]} : merged;
      });
    }
    if(Array.isArray(data.catalog) && data.catalog.length) equipmentCatalog = data.catalog;
    if(data.equipmentOwned && typeof data.equipmentOwned === 'object') equipmentOwned = data.equipmentOwned;
    if(Array.isArray(data.colorCatalog) && data.colorCatalog.length) colorCatalog = data.colorCatalog;
    if(Array.isArray(data.rigCatalog) && data.rigCatalog.length) rigCatalog = data.rigCatalog;
    if(Array.isArray(data.archivedRigs)) archivedRigs = data.archivedRigs;
    if(Array.isArray(data.customerCatalog) && data.customerCatalog.length) customerCatalog = data.customerCatalog;
    if(Array.isArray(data.templateCatalog) && data.templateCatalog.length) templateCatalog = data.templateCatalog;
    if(data.appSettings && typeof data.appSettings === 'object') appSettings = {...appSettings, ...data.appSettings};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
    localStorage.setItem(CATALOG_KEY, JSON.stringify(equipmentCatalog));
    localStorage.setItem(EQUIPMENT_OWNED_KEY, JSON.stringify(equipmentOwned));
    localStorage.setItem(COLOR_CATALOG_KEY, JSON.stringify(colorCatalog));
    localStorage.setItem(RIG_CATALOG_KEY, JSON.stringify(rigCatalog));
    localStorage.setItem(ARCHIVED_RIGS_KEY, JSON.stringify(archivedRigs));
    localStorage.setItem(CUSTOMER_CATALOG_KEY, JSON.stringify(customerCatalog));
    localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templateCatalog));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(appSettings));
    syncStatus = 'ok';
  }catch(e){
    console.error('Cloud pull failed', e);
    syncStatus = 'error';
  }
  render();
}

// Push current data up to the shared Google Sheet backend.
async function pushToCloud(){
  if(!syncUrl) return;
  pushInProgress = true;
  syncStatus = 'saving';
  render();
  try{
    // Photos and signatures are stripped before sending - a single Google
    // Sheets cell has a ~50,000 character limit, and base64 images would
    // blow past that fast. They stay local-only; see pullFromCloud above
    // for how they're preserved across syncs.
    const ticketsForCloud = tickets.map(t=>{
      const {photo, signatureDelivered, signatureReceived, ...rest} = t;
      return rest;
    });
    // Snapshot the deletes going out with THIS push. Only these get cleared
    // on success - a delete that happens while the request is in flight stays
    // queued for the next push instead of being silently dropped.
    const deletesToSend = pendingDeletes.slice();
    await fetch(syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ tickets: ticketsForCloud, deletes: deletesToSend, catalog: equipmentCatalog, equipmentOwned: equipmentOwned, colorCatalog: colorCatalog, rigCatalog: rigCatalog, archivedRigs: archivedRigs, customerCatalog: customerCatalog, templateCatalog: templateCatalog, appSettings: appSettings })
    });
    if(deletesToSend.length) pendingDeletes = pendingDeletes.filter(id=>!deletesToSend.includes(id));
    syncStatus = 'ok';
  }catch(e){
    console.error('Cloud push failed', e);
    syncStatus = 'error';
  }
  pushInProgress = false;
  render();
}

// Keeps the dedicated Signatures sheet (used by the standalone delivery
// signing links) in sync with edits made in the main app - so clearing or
// changing a signature here doesn't get silently overwritten by a stale
// value still sitting in that separate sheet on the next sync.
async function pushSignatureUpdate(ticketId, signatureDelivered, signatureReceived){
  if(!syncUrl) return;
  try{
    await fetch(syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ signatureUpdate: { ticketId, signatureDelivered: signatureDelivered||'', signatureReceived: signatureReceived||'', source: 'app' } })
    });
  }catch(e){
    console.error('Signature sync failed', e);
  }
}

// Clears (or edits) a ticket's return confirmation from the main app - the
// only other way this data gets written is through the standalone
// return-confirmation link, so this is needed to fix/reset test data or a
// mistaken submission without needing to touch the Google Sheet directly.
async function pushReturnUpdate(ticketId, conditions, signatureReceivedBack){
  if(!syncUrl) return;
  try{
    await fetch(syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ returnUpdate: { ticketId, conditions: conditions||[], signatureReceivedBack: signatureReceivedBack||'', source: 'app' } })
    });
  }catch(e){
    console.error('Return confirmation sync failed', e);
  }
}

// Uploads a photo or signature image to Google Drive via the sync backend,
// so the media survives beyond the single device's localStorage. Returns
// the public Drive URL on success, or null on failure. Runs async and
// never blocks the UI - a failed upload just means the backup didn't
// happen this time; the local copy still works fine.
async function uploadTicketMedia(ticketId, field, dataUrl){
  if(!syncUrl || !dataUrl) return null;
  try{
    const res = await fetch(syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ mediaUpload: { ticketId, field, data: dataUrl } })
    });
    const result = await res.json();
    if(result.url) return result.url;
  }catch(e){
    console.error('Media upload failed for ' + field, e);
  }
  return null;
}

// After a ticket is saved with photos or signatures captured in the main
// app, upload them to Drive in the background. Stores the returned URLs
// on the ticket so they travel through sync and survive localStorage loss.
async function backupTicketMedia(ticketId){
  const t = tickets.find(x=>x.id===ticketId);
  if(!t || !syncUrl) return;
  let changed = false;
  if(t.photo && !t.photoUrl){
    const url = await uploadTicketMedia(ticketId, 'photo', t.photo);
    if(url){ t.photoUrl = url; changed = true; }
  }
  if(t.signatureDelivered && !t.signatureDeliveredUrl){
    const url = await uploadTicketMedia(ticketId, 'signatureDelivered', t.signatureDelivered);
    if(url){ t.signatureDeliveredUrl = url; changed = true; }
  }
  if(t.signatureReceived && !t.signatureReceivedUrl){
    const url = await uploadTicketMedia(ticketId, 'signatureReceived', t.signatureReceived);
    if(url){ t.signatureReceivedUrl = url; changed = true; }
  }
  if(changed){
    t.updatedAt = nowIso();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets)); }catch(e){}
    // Push so the URLs travel to the other device and to the sheet.
    if(syncUrl) pushToCloud();
  }
}

function startAutoSync(){
  if(autoSyncTimer) clearInterval(autoSyncTimer);
  if(!syncUrl) return;
  autoSyncTimer = setInterval(()=>{
    // Skip auto-refresh while actively creating/editing a ticket, or while
    // typing in any field (search boxes, filters, etc.) - a background
    // re-render would knock focus out mid-stroke and interrupt data entry.
    if(currentTab === 'new') return;
    const active = document.activeElement;
    if(active && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName)) return;
    pullFromCloud(true);
  }, 30000);
}

// Safely connects to a Cloud Sync URL for the first time. Unlike a routine
// sync, this NEVER blindly overwrites one side with the other - it checks
// what's already in the cloud vs. what's on this device first, and only
// acts automatically when there's no ambiguity (one side is empty).
// If both sides already have real data, it asks before doing anything
// destructive, since silently discarding a device's tickets is unacceptable.
async function connectToCloud(url){
  syncStatus = 'loading';
  render();
  try{
    const res = await fetch(url, { method: 'GET' });
    if(!res.ok) throw new Error('Bad response');
    const data = await res.json();
    const cloudTickets = Array.isArray(data.tickets) ? data.tickets : [];
    const cloudHasData = cloudTickets.length > 0;
    const localHasData = tickets.length > 0;

    saveSyncUrl(url);

    if(cloudHasData && localHasData){
      const keepCloud = confirm(
        `Both this device (${tickets.length} ticket${tickets.length!==1?'s':''}) and the shared sheet ` +
        `(${cloudTickets.length} ticket${cloudTickets.length!==1?'s':''}) already have data.\n\n` +
        `Click OK to KEEP the shared sheet's data (this device's tickets will be replaced).\n` +
        `Click Cancel to UPLOAD this device's tickets instead (the shared sheet's data will be replaced).`
      );
      if(keepCloud){
        await pullFromCloud();
      }else{
        await pushToCloud();
      }
    }else if(cloudHasData && !localHasData){
      // Nothing to lose locally - safe to pull the shared data down.
      await pullFromCloud();
    }else{
      // Cloud is empty (or unreadable) - push whatever is on this device up,
      // even if that's also empty. Never overwrite local data with emptiness.
      await pushToCloud();
    }
  }catch(e){
    console.error('Connect failed', e);
    saveSyncUrl(url); // still save the URL so auto-sync/manual retry can use it
    syncStatus = 'error';
    alert('Could not reach that URL to check for existing data. The URL has been saved - try "Refresh Now" in a moment, or double-check the URL is correct.');
  }
  render();
}

async function loadTickets(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    tickets = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Could not load saved tickets', e);
    tickets = [];
  }
}

async function saveTickets(){

  }catch(e){
    console.error('Could not save tickets', e);
    alert('Warning: could not save your data. Your browser storage may be full or blocked (e.g. private/incognito mode).');
  }
  if(syncUrl) await pushToCloud();
}

// Looks at the most recently created ticket's number (e.g. "DT-1042") and
// suggests the next one in that pattern (e.g. "DT-1043"), preserving any
// leading zero-padding. Returns '' if no pattern can be detected.
function suggestNextTicketNumber(){
  if(tickets.length===0) return '';
  const last = tickets[tickets.length-1];
  const num = (last.ticketNumber||'').trim();
  const m = num.match(/^(.*?)(\d+)$/);
  if(!m) return '';
  const prefix = m[1];
  const digits = m[2];
  const next = (parseInt(digits,10)+1).toString().padStart(digits.length,'0');
  return prefix+next;
}

function renderGlobalSearchResults(){

  if(matches.length === 0){
    return `<div class="global-search-results"><div class="global-search-empty">No matches found.</div></div>`;
  }

  const rows = matches.map(t=>{
    const isOut = !t.returnDate;
    return `
      <div class="global-search-row" data-global-goto="${t.id}">
        <div>
          <span class="ticket-num" style="font-size:11px;">#${escHtml(t.ticketNumber||'—')}</span>

  return `<div class="global-search-results">${rows}</div>`;

function renderDashboard(){
  const outTickets = tickets.filter(t=>!t.returnDate);
  const totalOutItems = outTickets.reduce((s,t)=>s+t.equipment.reduce((s2,e)=>s2+(Number(e.qty)||0),0),0);
  const rigsActive = new Set(outTickets.map(t=>t.rig||'Unassigned rig')).size;

  const byCustomer = {};
  outTickets.forEach(t=>{
    const cust = t.customer || 'No Customer Listed';
    if(!byCustomer[cust]) byCustomer[cust] = [];
    byCustomer[cust].push(t);
  });

  const customerNames = Object.keys(byCustomer).sort((a,b)=>a.localeCompare(b));
  const jobGroups = customerNames.length ? customerNames.map(cust=>{
    const jobs = byCustomer[cust].slice().sort((a,b)=>(b.deliveryDate||'').localeCompare(a.deliveryDate||''));
    const rows = jobs.map(t=>{
      const overdue = isTicketOverdue(t);
      return `

    }).join('');
    return `<div class="rig-group">
      <h3><span>${escHtml(cust)}</span><span>${jobs.length} job${jobs.length!==1?'s':''}</span></h3>
      ${rows}
    </div>`;
  }).join('') : `<p style="font-size:13px; color:var(--ink-soft);">No jobs currently out.</p>`;

  if(tickets.length === 0){
    return `<div class="empty-state">

function renderBillingStatus(){
  const outTickets = tickets.filter(t=>!t.returnDate);
  // Only show tickets that have pad tracking data
  const tracked = outTickets.filter(t=>Array.isArray(t.pads) && t.pads.length > 0);
  if(tracked.length === 0) return '';

  // Build rows sorted by staleness (days since last billed, descending)
  const rows = tracked.map(t=>{
    const pad = getActivePad(t);
    if(!pad) return null;
    const billed = Array.isArray(pad.billedWells) ? pad.billedWells.length : 0;
    const total = pad.totalWells || 0;
    const daysSince = daysSinceLastBilled(pad);
    const complete = billed >= total && total > 0;
    return { ticket: t, pad, billed, total, daysSince, complete };
  }).filter(Boolean).sort((a,b)=>{
    // Incomplete pads first, then by staleness
    if(a.complete !== b.complete) return a.complete ? 1 : -1;
    const da = a.daysSince === null ? -1 : a.daysSince;
    const db = b.daysSince === null ? -1 : b.daysSince;
    return db - da;
  });

  if(rows.length === 0) return '';

  const tableRows = rows.map(r=>{
    const stale = r.daysSince !== null && r.daysSince > 14 && !r.complete;
    const pct = r.total > 0 ? Math.round((r.billed / r.total) * 100) : 0;
    return `
      <div class="rig-equip-row" style="cursor:pointer; display:flex; align-items:center; gap:12px; ${stale?'border-left:3px solid #B5432A;':''}" data-goto-ticket="${r.ticket.id}">
        <div style="flex:1; min-width:0;">
          <div class="rig-equip-name">${escHtml(r.ticket.rig||'Unassigned rig')}</div>
          <div class="rig-equip-meta">${escHtml(r.ticket.customer||'—')} · ${escHtml(r.pad.name)}</div>
        </div>
        <div style="width:80px; text-align:center;">
          <div style="font-family:'Oswald',sans-serif; font-size:15px; color:${r.complete?'var(--green)':'var(--ink)'};">${r.billed}/${r.total}</div>
          <div style="background:var(--paper-2); border-radius:3px; height:4px; margin-top:3px;">
            <div style="background:${r.complete?'var(--green)':'var(--amber)'}; border-radius:3px; height:100%; width:${pct}%;"></div>
          </div>
        </div>
        <div style="width:80px; text-align:right;">
          ${r.complete
            ? '<span style="font-size:11px; color:var(--green); font-family:\'IBM Plex Mono\',monospace;">PAD DONE</span>'
            : (r.daysSince !== null
                ? `<span style="font-size:12px; color:${stale?'#B5432A':'var(--ink-soft)'}; font-family:'IBM Plex Mono',monospace;">${r.daysSince}d ago</span>`
                : '<span style="font-size:11px; color:var(--ink-soft); font-family:\'IBM Plex Mono\',monospace;">NO BILLS</span>'
              )
          }
        </div>
      </div>
    `;
  }).join('');

  return `
    <h2 class="section-title">Billing Status by Rig</h2>
    <div class="rig-group">
      <h3><span>Wells Billed vs Total</span><span>Last Billed</span></h3>
      ${tableRows}
    </div>
  `;
}

function getFilteredTickets(){
  return tickets.filter(t=>{
    if(focusedTicketId) return t.id === focusedTicketId;
    if(searchTerm){
      const s = searchTerm.toLowerCase();
      const matchesText = (t.ticketNumber||'').toLowerCase().includes(s) ||
             (t.customer||'').toLowerCase().includes(s) ||
             (t.rig||'').toLowerCase().includes(s);
      if(!matchesText) return false;
    }
    if(ticketFilterCustomer && t.customer !== ticketFilterCustomer) return false;
    if(ticketFilterRig && t.rig !== ticketFilterRig) return false;
    if(ticketFilterDateFrom && (t.deliveryDate||'') < ticketFilterDateFrom) return false;
    if(ticketFilterDateTo && (t.deliveryDate||'') > ticketFilterDateTo) return false;
    return true;
  }).sort((a,b)=> (b.deliveryDate||'').localeCompare(a.deliveryDate||''));
}

function renderByRig(){
  const outTickets = tickets.filter(t=>!t.returnDate);
  if(outTickets.length === 0){
    return `<div class="empty-state">
      <div class="stamp">Nothing Out</div>
      <p>All equipment has been marked returned. Nothing currently out on a rig.</p>
    </div>`;
  }
  const byRig = {};
  outTickets.forEach(t=>{
    const rig = t.rig || 'Unassigned rig';
    if(!byRig[rig]) byRig[rig] = [];
    byRig[rig].push(t);
  });

  let rigNames = Object.keys(byRig).sort();
  if(rigSearchTerm){
    const s = rigSearchTerm.toLowerCase();
    rigNames = rigNames.filter(rig=>rig.toLowerCase().includes(s));
  }

  const noMatches = rigNames.length === 0;

  let groups = rigNames.map(rig=>{
    const rigTickets = byRig[rig];
    const itemCount = rigTickets.reduce((s,t)=>s+t.equipment.length,0);
    const customer = rigTickets[0]?.customer || '—';

    // Find the primary ticket for pad tracking (most recent delivery)
    const primaryTicket = rigTickets.slice().sort((a,b)=>(b.deliveryDate||'').localeCompare(a.deliveryDate||''))[0];
    const activePad = primaryTicket ? getActivePad(primaryTicket) : null;

    // Pad status summary for the rig header area
    let padHtml = '';
    if(activePad){
      const billed = Array.isArray(activePad.billedWells) ? activePad.billedWells.length : 0;
      const total = activePad.totalWells || 0;
      const pct = total > 0 ? Math.round((billed / total) * 100) : 0;
      const complete = billed >= total && total > 0;
      const daysSince = daysSinceLastBilled(activePad);
      const staleWarning = daysSince !== null && daysSince > 14;

      padHtml += `<div style="background:#FCFAF3; border:1.5px solid var(--line); border-radius:6px; padding:12px; margin:8px 0;">`;
      padHtml += `<div style="display:flex; justify-content:space-between; align-items:center;">`;
      padHtml += `<div style="font-weight:600; font-size:14px;">${escHtml(activePad.name)}</div>`;
      padHtml += `<span style="font-family:'IBM Plex Mono',monospace; font-size:12px; color:${complete?'var(--green)':'var(--ink-soft)'};">${billed} of ${total} billed${complete?' ✓':''}</span>`;
      padHtml += `</div>`;
      padHtml += `<div style="background:var(--paper-2); border-radius:4px; height:6px; margin:6px 0;">`;
      padHtml += `<div style="background:${complete?'var(--green)':'var(--amber)'}; border-radius:4px; height:100%; width:${pct}%; transition:width 0.3s;"></div>`;
      padHtml += `</div>`;
      if(daysSince !== null){
        padHtml += `<div style="font-size:11px; color:${staleWarning?'#B5432A':'var(--ink-soft)'};">${staleWarning?'⚠ ':''}Last billed ${daysSince} day${daysSince!==1?'s':''} ago</div>`;
      }
      if(billed > 0){
        padHtml += `<div style="margin-top:6px; font-size:12px; color:var(--ink-soft);">`;
        activePad.billedWells.forEach(w=>{
          padHtml += `<span style="display:inline-block; background:var(--paper-2); border-radius:3px; padding:2px 6px; margin:2px 4px 2px 0;">${fmtDate(w.date)}${w.label?' — '+escHtml(w.label):''}</span>`;
        });
        padHtml += `</div>`;
      }
      padHtml += `<div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">`;
      if(!complete){
        padHtml += `<button class="primary-btn" data-well-billed="${primaryTicket.id}" style="font-size:12px; padding:8px 14px;">Well Billed</button>`;
      }
      padHtml += `<button class="ghost-btn" data-rig-move="${primaryTicket.id}" style="font-size:12px; padding:7px 14px;">${complete?'Pad Complete — Rig Move':'Rig Move'}</button>`;
      padHtml += `</div>`;

      // Completed pad history
      const completedPads = Array.isArray(primaryTicket.pads) ? primaryTicket.pads.filter(p=>p.status==='complete') : [];
      if(completedPads.length > 0){
        padHtml += `<div style="margin-top:10px; border-top:1px solid var(--line); padding-top:8px;">`;
        padHtml += `<div style="font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;">Pad History</div>`;
        completedPads.forEach(p=>{
          const b = Array.isArray(p.billedWells) ? p.billedWells.length : 0;
          padHtml += `<div style="font-size:12px; color:var(--ink-soft); padding:3px 0;">${escHtml(p.name)} — ${b} of ${p.totalWells} wells — ${fmtDate(p.startDate)} to ${fmtDate(p.completedDate||'')}</div>`;
        });
        padHtml += `</div>`;
      }
      padHtml += `</div>`;
    } else if(primaryTicket) {
      padHtml = `<div style="background:#FCFAF3; border:1.5px solid var(--line); border-radius:6px; padding:12px; margin:8px 0;">
        <div style="font-size:13px; color:var(--ink-soft); margin-bottom:8px;">No pad tracking on this rig yet.</div>
        <button class="ghost-btn" data-add-pad="${primaryTicket.id}" style="font-size:12px; padding:7px 14px;">+ Add Pad</button>
      </div>`;
    }

    const ticketBlocks = rigTickets.map(t=>{
      const days = daysBetween(t.deliveryDate, todayStr());
      const overdue = isTicketOverdue(t);
      const equipLines = t.equipment.map(e=>`
        <div class="rig-equip-row">
          <div>
            <div class="rig-equip-name">${escHtml(e.name)} ${e.qty>1?('× '+e.qty):''}${e.serial?` <span style="color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400;">(S/N ${escHtml(e.serial)})</span>`:''}</div>
            ${e.bandColor?`<div class="rig-equip-meta">${colorSwatch(e.bandColor)}${escHtml(e.bandColor)} band</div>`:''}
          </div>
        </div>
      `).join('');
      return `
        <div class="rig-ticket-block" ${overdue?'style="border-left:3px solid #B5432A;"':''}>
          <label class="rig-ticket-header">
            <span class="ticket-num" style="margin-left:0;">#${escHtml(t.ticketNumber||'—')}</span>
            <span class="rig-equip-meta" style="margin-left:8px;">${escHtml(t.customer||'—')} · Out ${days} days</span>
            ${overdue?`<span class="status-pill" style="background:#FCEBEA; color:#B5432A; margin-left:auto;">Overdue</span>`:''}
          </label>
          <details class="equip-collapse">
            <summary style="cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); padding:6px 12px; list-style:none; display:flex; align-items:center; gap:6px; background:#FFFDF8;">
              <span style="font-size:14px; transition:transform 0.2s;">▸</span> ${t.equipment.length} equipment item${t.equipment.length!==1?'s':''}
            </summary>
            ${equipLines}
          </details>
        </div>
      `;
    }).join('');
    return `<div class="rig-group">
      <h3><span>${escHtml(rig)}</span><span>${itemCount} item${itemCount!==1?'s':''}</span></h3>
      ${padHtml}
      ${ticketBlocks}
    </div>`;
  }).join('');

  return `
    <div class="search-bar">
      <input type="text" id="rig-search-input" placeholder="Filter by rig name..." value="${escAttr(rigSearchTerm)}">
    </div>
    <h2 class="section-title">Rig Tracker</h2>
    ${noMatches ? `<p style="font-size:13px; color:var(--ink-soft);">No rigs match "${escHtml(rigSearchTerm)}".</p>` : groups}
  `;
}

function renderInventory(){
  const outTickets = tickets.filter(t=>!t.returnDate);

  if(outTickets.length === 0){
    return `<div class="empty-state">
      <div class="stamp">Nothing Out</div>
      <p>All equipment has been marked returned. Nothing currently out to show in inventory.</p>
    </div>`;
  }

  // Aggregate every equipment line across all open tickets, grouped by name.
  const byName = {};
  outTickets.forEach(t=>{
    t.equipment.forEach(e=>{
      const key = e.name || 'Unnamed';
      if(!byName[key]) byName[key] = { totalQty: 0, lines: [] };
      byName[key].totalQty += Number(e.qty)||0;
      byName[key].lines.push({
        qty: e.qty, serial: e.serial, bandColor: e.bandColor,
        ticketNumber: t.ticketNumber, rig: t.rig, customer: t.customer, deliveryDate: t.deliveryDate
      });
    });
  });

  let names = Object.keys(byName).sort((a,b)=>a.localeCompare(b));
  if(inventorySearchTerm){
    const s = inventorySearchTerm.toLowerCase();
    names = names.filter(n=>n.toLowerCase().includes(s));
  }

  const totalUnitsOut = names.reduce((sum,n)=>sum+byName[n].totalQty, 0);
  const distinctTypesOut = Object.keys(byName).length;
  const overCapacityCount = Object.keys(byName).filter(n=>{
    const owned = equipmentOwned[n];
    return owned != null && owned > 0 && byName[n].totalQty > owned;
  }).length;

  const noMatches = names.length === 0;

  const groups = names.map(name=>{
    const info = byName[name];
    const owned = equipmentOwned[name];
    const hasOwned = owned != null && owned > 0;
    const pct = hasOwned ? Math.min(100, Math.round((info.totalQty/owned)*100)) : 0;
    const overCapacity = hasOwned && info.totalQty > owned;
    const utilizationLabel = hasOwned
      ? `${info.totalQty} of ${owned} out${overCapacity?' (over capacity!)':''}`
      : `${info.totalQty} unit${info.totalQty!==1?'s':''} out`;
    const barColor = overCapacity ? '#B5432A' : (pct >= 80 ? '#D9822B' : '#33D63A');
    const rows = info.lines.map(line=>{
      const days = daysBetween(line.deliveryDate, todayStr());
      return `
        <div class="rig-equip-row">
          <div>
            <div class="rig-equip-name">${escHtml(line.rig||'Unassigned rig')} ${line.qty>1?('× '+line.qty):''}${line.serial?` <span style="color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:400;">(S/N ${escHtml(line.serial)})</span>`:''}</div>
            <div class="rig-equip-meta">Ticket #${escHtml(line.ticketNumber||'—')} · ${escHtml(line.customer||'—')}${line.bandColor?` · ${colorSwatch(line.bandColor)}${escHtml(line.bandColor)} band`:''}</div>
          </div>
          <div style="text-align:right;">
            <div class="rig-equip-meta">${days} days out</div>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="rig-group">
      <h3><span>${escHtml(name)}</span><span>${utilizationLabel}</span></h3>
      ${hasOwned?`<div style="height:5px; background:#E8EDE8;"><div style="height:100%; width:${pct}%; background:${barColor};"></div></div>`:''}
      ${rows}
    </div>`;
  }).join('');

  return `
    <div class="search-bar">
      <input type="text" id="inventory-search-input" placeholder="Filter by equipment name..." value="${escAttr(inventorySearchTerm)}">
    </div>
    <div class="summary-cards" style="grid-template-columns:repeat(${overCapacityCount>0?3:2},1fr);">
      <div class="summary-card"><div class="num">${distinctTypesOut}</div><div class="lbl">Equipment Types Out</div></div>
      <div class="summary-card"><div class="num">${totalUnitsOut}</div><div class="lbl">Total Units Out</div></div>
      ${overCapacityCount>0?`<div class="summary-card" style="border-color:#B5432A;"><div class="num" style="color:#B5432A;">${overCapacityCount}</div><div class="lbl">Over Capacity</div></div>`:''}
    </div>
    <h2 class="section-title">Inventory Currently Out, By Equipment</h2>
    ${noMatches ? `<p style="font-size:13px; color:var(--ink-soft);">No equipment matches "${escHtml(inventorySearchTerm)}".</p>` : groups}
  `;
}

// Resizes/compresses an uploaded image file down to a reasonable size before
// storing it as base64, since localStorage has limited space per browser.
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else { width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Wires up a <canvas> as a drawable signature pad. Restores a previously
// saved signature (if any) so it survives re-renders triggered by other
// form fields changing, and saves a snapshot to draftTicket after each stroke.
function setupSignaturePad(canvasId, fieldName){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#1B211C';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const existing = draftTicket[fieldName];
  if(existing){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = existing;
  }

  let drawing = false;

  function getPos(ev){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (ev.clientX - rect.left) * scaleX, y: (ev.clientY - rect.top) * scaleY };
  }

  canvas.onpointerdown = (ev)=>{
    drawing = true;
    const p = getPos(ev);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    canvas.setPointerCapture(ev.pointerId);
  };
  canvas.onpointermove = (ev)=>{
    if(!drawing) return;
    const p = getPos(ev);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  const endStroke = ()=>{
    if(!drawing) return;
    drawing = false;
    draftTicket[fieldName] = canvas.toDataURL('image/png');
  };
  canvas.onpointerup = endStroke;
  canvas.onpointerleave = endStroke;
  canvas.onpointercancel = endStroke;
}

function renderPadSection(t){
  const hasPads = Array.isArray(t.pads) && t.pads.length > 0;
  if(!hasPads) return '';

  const activePad = getActivePad(t);
  const completedPads = t.pads.filter(p=>p.status === 'complete');

  let html = '<div style="font-family:\'IBM Plex Mono\',monospace; font-size:11px; margin-bottom:8px; padding:6px 0; border-top:1px solid var(--line);">';
  html += '<span style="text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft);">Pad: </span>';

  if(activePad){
    const billed = Array.isArray(activePad.billedWells) ? activePad.billedWells.length : 0;
    const total = activePad.totalWells || 0;
    const complete = billed >= total && total > 0;
    html += `<span style="color:${complete?'var(--green)':'var(--ink)'};">${escHtml(activePad.name)} — ${billed}/${total} billed${complete?' ✓':''}</span>`;
  }

  if(completedPads.length > 0){
    html += `<details style="margin-top:6px;" class="equip-collapse">`;
    html += `<summary style="cursor:pointer; font-size:11px; color:var(--ink-soft); list-style:none; display:flex; align-items:center; gap:6px; padding:2px 0;">`;
    html += `<span style="font-size:14px; transition:transform 0.2s;">▸</span> ${completedPads.length} previous pad${completedPads.length!==1?'s':''}`;
    html += `</summary>`;
    html += `<div style="padding:4px 0 2px 0;">`;
    completedPads.forEach(p=>{
      const b = Array.isArray(p.billedWells) ? p.billedWells.length : 0;
      html += `<div style="font-size:11px; color:var(--ink-soft); padding:3px 0;">${escHtml(p.name)} — ${b}/${p.totalWells} wells — ${fmtDate(p.startDate)} to ${fmtDate(p.completedDate||'')}</div>`;
    });
    html += `</div></details>`;
  }

  html += '</div>';
  return html;
}

function renderReturnConfirmationSummary(rc, ticketId){
  if(!rc || !rc.conditions || rc.conditions.length===0) return '';
  const flagged = rc.conditions.filter(c=>c.condition && c.condition !== 'Good');
  const badgeColor = flagged.length ? '#B5432A' : '#1E8A29';
  const summaryText = flagged.length
    ? `${flagged.length} item${flagged.length!==1?'s':''} flagged on return`
    : 'All items confirmed good on return';
  const detailRows = rc.conditions.map(c=>`
    <div style="font-size:12px; padding:3px 0; ${c.condition && c.condition!=='Good' ? 'color:#B5432A; font-weight:600;' : 'color:var(--ink-soft);'}">
      ${escHtml(c.name)}: ${escHtml(c.condition||'Good')}${c.notes?` — ${escHtml(c.notes)}`:''}
    </div>
  `).join('');
  return `
    <div style="border:1.5px solid ${badgeColor}; border-radius:6px; padding:8px 10px; margin-bottom:10px; background:#FFFDF8;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:${badgeColor};">Return Confirmation — ${escHtml(summaryText)}</span>
        <button data-clear-return="${escAttr(ticketId)}" style="background:none; border:none; color:var(--ink-soft); font-size:11px; text-decoration:underline; cursor:pointer; padding:0;">Clear</button>
      </div>
      ${detailRows}
      ${rc.signatureReceivedBack?`<div style="font-size:11px; color:var(--ink-soft); margin-top:4px;">Signed by driver on return${rc.pdfUrl?` &middot; <a href="${escAttr(rc.pdfUrl)}" target="_blank" rel="noopener" style="color:#2E5FA3; text-decoration:underline;">View return PDF</a>`:''}</div>`:''}
    </div>
  `;
}

function colorSwatch(name){
  if(!name) return '';
  const hex = COLOR_SWATCH_MAP[String(name).toLowerCase().trim()];
  if(!hex) return '';
  return `<span style="display:inline-block; width:11px; height:11px; border-radius:50%; background:${hex}; border:1px solid rgba(0,0,0,0.25); margin-right:6px; vertical-align:middle;"></span>`;
}

function escHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return escHtml(s); }

    if(autoSyncTimer) clearInterval(autoSyncTimer);

  };

  const exportBtn = document.getElementById('export-data-btn');

  };

  const exportCsvBtn = document.getElementById('export-csv-btn');
  if(exportCsvBtn) exportCsvBtn.onclick = ()=>{
    const headers = ['Ticket Number','Customer','Rig/Lease','Delivery Date','Return Date','Status','Total Cost','Equipment','Serial Number','Inspection Band','Qty','Notes'];
    const csvRows = [headers.join(',')];
    const csvEscape = (val)=>{
      const s = String(val==null?'':val);
      if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
      return s;
    };
    tickets.forEach(t=>{

        csvRows.push([t.ticketNumber,t.customer,t.rig,t.deliveryDate,t.returnDate||'',status,cost,'','','','',t.notes].map(csvEscape).join(','));
      }else{
        t.equipment.forEach(e=>{
          csvRows.push([
            t.ticketNumber, t.customer, t.rig, t.deliveryDate, t.returnDate||'', status, cost,
            e.name, e.serial||'', e.bandColor||'', e.qty, t.notes
          ].map(csvEscape).join(','));

    });
    const blob = new Blob([csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8' });

  };

  const saveOverdueBtn = document.getElementById('save-overdue-threshold');
  if(saveOverdueBtn) saveOverdueBtn.onclick = async ()=>{
    const input = document.getElementById('overdue-threshold-input');
    const val = Number(input.value);
    if(!val || val < 1){ alert('Please enter a number of days greater than 0.'); return; }
    appSettings.overdueThresholdDays = val;
    await saveAppSettings();
    render();
  };

  const importBtn = document.getElementById('import-data-btn');
  const importFileInput = document.getElementById('import-data-file');
  if(importBtn && importFileInput){
    importBtn.onclick = ()=> importFileInput.click();
    importFileInput.onchange = async ()=>{
      const file = importFileInput.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const parsed = JSON.parse(text);
        if(!Array.isArray(parsed.tickets)){
          alert('This file doesn\'t look like a valid Equipment Tracker backup.');
          return;
        }
        const count = parsed.tickets.length;
        const willReplace = tickets.length > 0;
        const msg = willReplace
          ? `This will REPLACE your current ${tickets.length} ticket(s) with the ${count} ticket(s) from this backup file. This cannot be undone. Continue?`
          : `Import ${count} ticket(s) from this backup file?`;
        if(!confirm(msg)) return;

        // Pause the background auto-sync while importing - otherwise a
        // periodic pull landing mid-import can fetch the still-current
        // (pre-import) cloud data and stomp the import a moment later.
        if(autoSyncTimer){ clearInterval(autoSyncTimer); autoSyncTimer = null; }

        tickets = parsed.tickets;
        if(Array.isArray(parsed.catalog) && parsed.catalog.length){
          equipmentCatalog = parsed.catalog;
        }
        if(parsed.equipmentOwned && typeof parsed.equipmentOwned === 'object'){
          equipmentOwned = parsed.equipmentOwned;
        }
        if(Array.isArray(parsed.colorCatalog) && parsed.colorCatalog.length){
          colorCatalog = parsed.colorCatalog;
        }
        if(Array.isArray(parsed.rigCatalog) && parsed.rigCatalog.length){
          rigCatalog = parsed.rigCatalog;
        }
        if(Array.isArray(parsed.customerCatalog) && parsed.customerCatalog.length){
          customerCatalog = parsed.customerCatalog;
        }
        if(Array.isArray(parsed.templateCatalog) && parsed.templateCatalog.length){
          templateCatalog = parsed.templateCatalog;
        }

        // Write everything to local storage directly (fast, synchronous,
        // no network round-trips in between) rather than calling each
        // saveX() helper separately - each of those also triggers its own
        // cloud push, and doing seven of them back-to-back both wastes
        // requests and widens the window for the race described above.
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets)); }catch(e){}
        try{ localStorage.setItem(CATALOG_KEY, JSON.stringify(equipmentCatalog)); }catch(e){}
        try{ localStorage.setItem(EQUIPMENT_OWNED_KEY, JSON.stringify(equipmentOwned)); }catch(e){}
        try{ localStorage.setItem(COLOR_CATALOG_KEY, JSON.stringify(colorCatalog)); }catch(e){}
        try{ localStorage.setItem(RIG_CATALOG_KEY, JSON.stringify(rigCatalog)); }catch(e){}
        try{ localStorage.setItem(CUSTOMER_CATALOG_KEY, JSON.stringify(customerCatalog)); }catch(e){}
        try{ localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templateCatalog)); }catch(e){}

        // One single push with the fully-imported state, then resume
        // auto-sync once it's safely landed.
        if(syncUrl) await pushToCloud();
        startAutoSync();

        alert('Import complete.');
        render();
      }catch(e){
        console.error('Import failed', e);
        alert('Could not read that file. Make sure it\'s a backup exported from this app.');
      }
      importFileInput.value = '';
    };
  }

  if(currentTab === 'dashboard'){
    document.querySelectorAll('[data-goto-ticket]').forEach(row=>{
      row.onclick = ()=>{
        const t = tickets.find(x=>x.id===row.dataset.gotoTicket);

        ticketFilterCustomer = '';
        ticketFilterRig = '';
        ticketFilterDateFrom = '';
        ticketFilterDateTo = '';

        render();
      };
    });
  }

  if(currentTab === 'new'){
    const ticketFieldMap = {
      'f-ticketNumber': 'ticketNumber',
      'f-customer': 'customer',
      'f-rig': 'rig',
      'f-deliveryDate': 'deliveryDate',
      'f-returnDate': 'returnDate',
      'f-notes': 'notes',
      'f-pad-name': 'initialPadName',
      'f-pad-wells': 'initialPadWells'
    };
    Object.keys(ticketFieldMap).forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.oninput = ()=>{ draftTicket[ticketFieldMap[id]] = el.value; };
    });

    // Suggests a well-charge amount for known customer/rig-specific rules
    // (e.g. Firebird's $120/day, Cactus 407's extra casing charge) based on
    // how many days have passed since the last well charge on this ticket
    // (or since delivery, if this is the first one). Only a starting
    // suggestion - always editable before saving.
    function suggestWellChargeAmount(newEntryDate){
      const cust = (draftTicket.customer||'').trim().toLowerCase();
      const rig = (draftTicket.rig||'').trim().toLowerCase();
      if(cust !== 'firebird energy ii') return { amount:'', label:'' };
      const sorted = draftWellCharges.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const lastDate = sorted.length ? sorted[sorted.length-1].date : draftTicket.deliveryDate;
      const days = Math.max(1, daysBetween(lastDate || todayStr(), newEntryDate || todayStr()));
      let amount = 120 * days;
      let label = '';
      if(rig === 'cactus 407'){
        amount += 425;
        label = 'Includes extra casing component';
      }
      return { amount: String(amount), label };
    }

    const addWellChargeBtn = document.getElementById('add-well-charge');
    if(addWellChargeBtn) addWellChargeBtn.onclick = ()=>{
      const today = todayStr();

      };

    // Inspection band color dropdown selects
    document.querySelectorAll('select[data-field="bandColor"]').forEach(sel=>{
      const row = draftEquip.find(e=>e.id===sel.dataset.eqid);
      if(row){
        if(row.bandColor && colorCatalog.includes(row.bandColor)) sel.value = row.bandColor;
        else if(row.bandColor) sel.value = '__customcolor__';
        else sel.value = '';
      }
      sel.onchange = ()=>{
        const row = draftEquip.find(e=>e.id===sel.dataset.eqid);
        if(!row) return;
        row.bandColor = (sel.value === '__customcolor__') ? '' : sel.value;
        render();
        if(sel.value === '__customcolor__'){
          const customInput = document.querySelector(`input[data-field="customcolor"][data-eqid="${row.id}"]`);
          if(customInput) customInput.focus();
        }
      };
    });

    document.querySelectorAll('input[data-field="customcolor"]').forEach(inp=>{
      inp.oninput = ()=>{
        const row = draftEquip.find(e=>e.id===inp.dataset.eqid);
        if(row) row.bandColor = inp.value;
      };
    });

    // Qty / price fields
    document.querySelectorAll('input[data-field="qty"], input[data-field="price"], input[data-field="serial"]').forEach(inp=>{
      inp.oninput = ()=>{
        const row = draftEquip.find(e=>e.id===inp.dataset.eqid);
        if(row) row[inp.dataset.field] = inp.value;
      };

    // Photo attachment
    const photoInput = document.getElementById('f-photo');
    if(photoInput){

          alert('Could not process that photo. Try a different image.');
        }
